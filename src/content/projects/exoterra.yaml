es:
  title: EXOTERRA
  tagline: EXPLORADOR 3D DE EXOPLANETAS
  summary: >-
    ExoTerra es un explorador web en 3D de exoplanetas reales a partir del catálogo público de la
    NASA. Cada planeta se genera de forma procedural según sus datos físicos y se puede explorar,
    filtrar y comparar. Diseñé la interfaz y desarrollé el frontend, los shaders y la ingesta de
    datos.
  challenge:
    - >-
      Los datos de la NASA llegan como un CSV plano. Había que limpiarlos y convertirlos en algo que
      se entienda de un vistazo, sin perder el rigor de las cifras.
    - >-
      No hay fotos de estos planetas: cada superficie tenía que generarse por código y diferenciar
      mundos rocosos, oceánicos y gigantes gaseosos.
    - >-
      Con miles de planetas y escenas 3D en pantalla, la navegación tenía que seguir siendo fluida.
  approach: >-
    Escribí scripts en Python que limpian el CSV de la NASA y lo cargan en Supabase. En PostgreSQL,
    triggers en PL/pgSQL calculan un índice de habitabilidad a partir de radio, masa, insolación y
    temperatura, e infieren el color de la atmósfera al insertar cada planeta. El frontend usa React
    19 con React Three Fiber y shaders GLSL propios para superficie, atmósfera y anillos. La
    interfaz, en Tailwind CSS con componentes tipo HUD, organiza 10 vistas, entre ellas catálogo,
    comparador, sistema estelar y línea de tiempo. Una caché local y Zustand reducen las consultas.
  outcome: >-
    Sitio publicado en Vercel con catálogo filtrable, ficha de cada planeta, explorador 3D,
    comparador y línea de tiempo de descubrimientos.
en:
  title: EXOTERRA
  tagline: 3D EXOPLANET EXPLORER
  summary: >-
    ExoTerra is a 3D web explorer of real exoplanets based on NASA's public catalog. Each planet is
    procedurally generated from its physical data and can be explored, filtered and compared. I
    designed the interface and built the front end, the shaders and the data pipeline.
  challenge:
    - >-
      NASA data comes as a flat CSV. It had to be cleaned and turned into something readable at a
      glance without losing scientific accuracy.
    - >-
      There are no photos of these planets: every surface had to be generated in code and tell
      rocky worlds, ocean worlds and gas giants apart.
    - >-
      With thousands of planets and 3D scenes on screen, navigation still had to feel smooth.
  approach: >-
    I wrote Python scripts that clean NASA's CSV and load it into Supabase. In PostgreSQL, PL/pgSQL
    triggers compute a habitability score from radius, mass, insolation and temperature, and infer
    atmosphere color as each planet is inserted. The front end uses React 19 with React Three Fiber
    and custom GLSL shaders for surface, atmosphere and rings. The interface, built with Tailwind
    CSS and HUD-style components, spans 10 views including catalog, comparison, star system and
    timeline. A local cache and Zustand cut down on queries.
  outcome: >-
    Site live on Vercel with a filterable catalog, per-planet detail pages, a 3D explorer, a
    comparison tool and a discovery timeline.
