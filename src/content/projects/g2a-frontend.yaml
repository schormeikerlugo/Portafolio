es:
  title: G2A REDESIGN
  tagline: MI PRIMERA MAQUETACIÓN WEB
  summary: >-
    Rediseño no oficial de la tienda de videojuegos G2A y mi primer proyecto de maquetación. Primero
    diseñé la interfaz en Adobe XD y luego la llevé a código con HTML, CSS y JavaScript, sin
    frameworks, aprendiendo cada técnica a medida que la necesitaba.
  challenge:
    - >-
      Era mi primer contacto con la maquetación: tenía que pasar de un diseño estático en Adobe XD a
      una página real usando solo HTML y CSS escritos a mano.
    - >-
      La interfaz tiene mucha información a la vez: barra lateral, novedades, juegos populares,
      promociones y ranking. Había que ordenarla sin que se sintiera saturada.
    - >-
      El diseño de escritorio, con barra lateral fija, tenía que adaptarse a pantallas pequeñas sin
      perder la navegación.
  approach: >-
    Construí la página sección por sección siguiendo el diseño de Adobe XD: barra lateral con perfil
    y menú, cabecera con buscador, carrusel de novedades, tabla de juegos populares, carrusel de
    promociones y un ranking con desplazamiento automático. Los layouts usan Flexbox y Grid, y las
    media queries ajustan la página en varios puntos de corte. En pantallas pequeñas la barra
    lateral se convierte en un menú hamburguesa con overlay. Cada interacción vive en su propio
    archivo de JavaScript.
  outcome: >-
    Página publicada en GitHub Pages: el punto de partida de mi trabajo como desarrollador frontend.
en:
  title: G2A REDESIGN
  tagline: MY FIRST WEB BUILD
  summary: >-
    An unofficial redesign of the G2A game store and my first front-end build. I designed the
    interface in Adobe XD first, then turned it into code with plain HTML, CSS and JavaScript,
    learning each technique as I needed it.
  challenge:
    - >-
      It was my first time building a layout: I had to go from a static Adobe XD design to a real
      page using only hand-written HTML and CSS.
    - >-
      The interface packs a lot in at once: sidebar, new releases, popular games, promotions and
      rankings. It had to be organized without feeling crowded.
    - >-
      The desktop layout, with a fixed sidebar, had to adapt to small screens without losing
      navigation.
  approach: >-
    I built the page section by section following the Adobe XD design: a sidebar with profile and
    menu, a header with search, a new-releases carousel, a popular-games table, a promotions
    carousel and an auto-scrolling ranking. Layouts use Flexbox and Grid, and media queries adjust
    the page across several breakpoints. On small screens the sidebar turns into a hamburger menu
    with an overlay. Each interaction lives in its own JavaScript file.
  outcome: >-
    Page published on GitHub Pages: the starting point of my work as a front-end developer.
