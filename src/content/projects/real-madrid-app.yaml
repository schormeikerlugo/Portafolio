es:
  title: REAL MADRID APP
  tagline: CONCEPTO DE APP PARA AFICIONADOS
  summary: >-
    Concepto no oficial de app móvil para el Real Madrid que reúne noticias, resultados de partidos y
    la tienda del club en un mismo lugar. Lo diseñé como ejercicio personal en Figma: navegación,
    pantallas clave y sistema visual, publicados en Behance.
  challenge:
    - >-
      Unir tres usos muy distintos (leer noticias, seguir un partido y comprar una camiseta) sin que
      la app se sienta como tres productos pegados.
    - >-
      Dar protagonismo a la fotografía de jugadores y equipaciones sin perder legibilidad en
      marcadores, tallas o precios.
    - >-
      Reflejar la identidad del club con una interfaz limpia, lejos de las portadas saturadas de
      banners habituales en apps deportivas.
  approach: >-
    Organicé la app con una barra inferior de cinco accesos (noticias, tienda, resultados,
    multimedia y búsqueda) y un menú lateral con las secciones secundarias como Competiciones o Mi
    Madrid. Sobre fondos claros usé el azul como color de acción y el escudo y el logo de Adidas como
    únicos acentos de marca. La pantalla de partido muestra el marcador grande y debajo pestañas de
    cronología, alineación y estadísticas, con tarjetas por gol. La tienda filtra por Hombre, Mujer y
    Niños y la ficha de producto prioriza la foto, el selector de talla y el botón de carrito.
  outcome: >-
    Concepto publicado en Behance con 3 composiciones que muestran 6 pantallas: menú, noticias,
    partido, tienda, ficha de producto y jugador destacado.
en:
  title: REAL MADRID APP
  tagline: FAN APP CONCEPT
  summary: >-
    An unofficial mobile app concept for Real Madrid that brings news, match results and the club
    store into one place. I designed it in Figma as a personal exercise: navigation, key screens and
    visual system, published on Behance.
  challenge:
    - >-
      Combining three very different uses (reading news, following a match and buying a shirt)
      without the app feeling like three products stitched together.
    - >-
      Letting player and kit photography lead while keeping scores, sizes and prices easy to read.
    - >-
      Reflecting the club's identity through a clean interface, away from the banner-heavy home
      screens common in sports apps.
  approach: >-
    I structured the app around a five-item bottom bar (news, store, results, media and search) and
    a side menu for secondary sections such as Competitions or Mi Madrid. On light backgrounds, blue
    is the action color and the crest and Adidas logo are the only brand accents. The match screen
    shows a large scoreline followed by tabs for timeline, lineup and stats, with a card per goal.
    The store filters by Men, Women and Kids, and the product page puts the photo, size picker and
    add-to-cart button first.
  outcome: >-
    Concept published on Behance as 3 compositions covering 6 screens: menu, news, match, store,
    product page and featured player.
