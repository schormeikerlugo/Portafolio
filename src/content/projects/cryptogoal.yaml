es:
  title: CRYPTOGOAL.IO
  tagline: WEB DE METAS CON SMART CONTRACTS
  summary: >-
    CryptoGoal.io es un concepto de producto para cumplir metas personales: fijas un objetivo y una
    fecha, depositas Ethereum en un smart contract y lo recuperas si lo logras. Diseñé la landing en
    escritorio y móvil, el login y un panel de saldo con historial de transacciones.
  challenge:
    - >-
      La idea mezcla motivación personal con contratos inteligentes. La landing tenía que explicar
      el mecanismo en pocos pasos y sin jerga técnica.
    - >-
      Había que responder dudas obvias antes de que el usuario las hiciera: qué pasa si no cumplo,
      quién verifica la meta y adónde va el dinero.
    - >-
      Las mismas secciones debían funcionar en una página larga de escritorio y en una secuencia de
      pantallas móviles.
  approach: >-
    El hero resume el funcionamiento en tres pasos numerados (meta y fecha, depósito, cumplir y
    recuperar). Debajo, la página se organiza como preguntas frecuentes en bloques alternos de texto
    e ilustración isométrica: qué es CryptoGoal, cómo sabe si cumpliste y qué pasa si fallas. La
    paleta violeta con el diamante de Ethereum en cian y monedas doradas une todas las piezas. En
    móvil, cada pregunta pasa a ser una pantalla propia. El panel muestra el saldo por moneda, una
    curva de evolución y una tabla con el estado de cada transacción.
  outcome: >-
    Landing para escritorio y móvil, login y panel de transacciones publicados en Behance.
en:
  title: CRYPTOGOAL.IO
  tagline: SMART CONTRACT GOALS WEB
  summary: >-
    CryptoGoal.io is a product concept for personal goals: you set a goal and a deadline, deposit
    Ethereum into a smart contract, and get it back if you succeed. I designed the landing page for
    desktop and mobile, the login, and a balance panel with transaction history.
  challenge:
    - >-
      The idea mixes personal motivation with smart contracts. The landing page had to explain the
      mechanism in a few steps, without technical jargon.
    - >-
      It had to answer the obvious questions upfront: what happens if I miss my goal, who verifies
      it, and where the money goes.
    - >-
      The same sections had to work as one long desktop page and as a sequence of mobile screens.
  approach: >-
    The hero sums up the mechanism in three numbered steps (goal and deadline, deposit, succeed and
    reclaim). Below it, the page reads like an FAQ, alternating text with isometric illustrations:
    what CryptoGoal is, how it knows you hit your goal, and what happens if you miss it. A purple
    palette with a cyan Ethereum diamond and gold coins ties every piece together. On mobile, each
    question becomes its own screen. The panel shows balance per coin, a trend curve, and a table
    with each transaction's status.
  outcome: >-
    Desktop and mobile landing page, login, and transactions panel published on Behance.
