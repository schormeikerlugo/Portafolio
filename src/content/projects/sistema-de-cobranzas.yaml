es:
  title: SISTEMA DE COBRANZAS
  tagline: APP MÓVIL + PANEL WEB DE COBRANZA
  summary: >-
    Concepto de sistema de cobranzas con dos piezas: una app móvil para registrar contratos, tratos,
    cuadrillas y actividad diaria en terreno, y un panel web para seguir pagos y cuentas vencidas.
    Diseñé ambas interfaces y la landing del producto.
  challenge:
    - >-
      El registro de usuarios incluía validación con un PIN único; el flujo tenía que ser claro y
      manejar bien los casos de error.
    - >-
      Un mismo usuario trabaja con varias empresas o bodegas, así que la app debía dejar claro en
      cuál está operando en cada momento.
    - >-
      En el panel web, lo urgente (lo vencido) tenía que destacar frente a lo pagado y lo que está
      por vencer.
  approach: >-
    En la app dividí el registro en pasos numerados con pantallas de éxito y de error que permiten
    reintentar. Tras iniciar sesión, el usuario elige empresa en una lista con foto, y esa empresa
    queda fija en el header de cada pantalla. El inicio agrupa los registros en cuatro accesos
    (contratos, tarjas, cuadrillas, tratos), y los contratos se listan con estado "por enviar" o
    "enviado". En el panel web, tres tarjetas de color (pagado, por vencer, vencido) resumen la
    cartera sobre una gráfica mensual, y añadí un chat de soporte en la app.
  outcome: >-
    Presentación publicada en Behance con el flujo de registro, las pantallas de la app, la
    landing y el panel web.
en:
  title: SISTEMA DE COBRANZAS
  tagline: COLLECTIONS MOBILE APP + WEB PANEL
  summary: >-
    A collections system concept with two parts: a mobile app for logging contracts, deals, crews and
    daily field activity, and a web panel for tracking payments and overdue accounts. I designed both
    interfaces and the product landing page.
  challenge:
    - >-
      User sign-up included validation with a unique PIN; the flow had to be clear and handle error
      cases well.
    - >-
      A single user works with several companies or warehouses, so the app had to make it obvious
      which one they were operating in at any moment.
    - >-
      In the web panel, what's urgent (overdue) had to stand out from what's paid or coming due.
  approach: >-
    In the app I split sign-up into numbered steps with success and error screens that allow
    retrying. After logging in, users pick a company from a photo list, and that company stays
    pinned in every screen's header. The home screen groups records into four entry points
    (contracts, tally sheets, crews, deals), and contracts are listed as "to send" or "sent". In the
    web panel, three color cards (paid, coming due, overdue) summarize the portfolio above a monthly
    chart, and I added a support chat inside the app.
  outcome: >-
    Case study published on Behance with the sign-up flow, app screens, landing page and web panel.
