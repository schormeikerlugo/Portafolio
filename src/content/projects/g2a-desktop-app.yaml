es:
  title: G2A DESKTOP APP
  tagline: REDISEÑO DE TIENDA GAMING
  summary: >-
    Rediseño no oficial de la página de inicio de G2A, una tienda de claves de videojuegos y
    tarjetas regalo. Diseñé una versión de escritorio tipo aplicación y su adaptación a móvil en
    Figma, con algunas ilustraciones generadas con Bing Image Creator.
  challenge:
    - >-
      La tienda vende para muchas plataformas y categorías (juegos, tarjetas regalo, suscripciones,
      cripto). Había que filtrar todo eso sin saturar la portada.
    - >-
      La portada debía mezclar novedades, tráilers, rankings, promociones y valoraciones sin que
      compitieran entre sí.
    - >-
      El diseño de escritorio con menú lateral tenía que funcionar también en una pantalla móvil.
  approach: >-
    Separé los dos ejes de navegación: las plataformas (PC, PS5, Xbox, Switch, PSN, Game Pass) van
    en pestañas arriba y las categorías en un menú lateral con el perfil y el saldo del usuario. El
    contenido se ordena en módulos de un mismo estilo: carrusel de novedades, tráiler destacado,
    top 10 en tabla, promociones y una fila de portadas con la nota de la crítica. La interfaz usa
    Avenir y una paleta de grises oscuros (#1E1E1E, #3A3A3A) con el azul #0084FF solo en acciones y
    estados activos. En móvil, las pestañas de plataforma se quedan fijas bajo la cabecera.
  outcome: >-
    Pantalla de inicio de escritorio, versión móvil, guía de estilo y wireframe publicados en
    Behance.
en:
  title: G2A DESKTOP APP
  tagline: GAMING STORE REDESIGN
  summary: >-
    An unofficial redesign of the G2A home page, a store for game keys and gift cards. I designed an
    app-like desktop version and its mobile adaptation in Figma, with some illustrations generated
    with Bing Image Creator.
  challenge:
    - >-
      The store sells across many platforms and categories (games, gift cards, subscriptions,
      crypto). All of that needed filtering without crowding the front page.
    - >-
      The home page had to combine new releases, trailers, rankings, promotions, and ratings without
      them competing with each other.
    - >-
      The sidebar-based desktop layout also had to work on a phone screen.
  approach: >-
    I split navigation into two axes: platforms (PC, PS5, Xbox, Switch, PSN, Game Pass) as tabs at
    the top, and categories in a sidebar alongside the user's profile and balance. Content is
    arranged in modules that share one style: a new-releases carousel, a featured trailer, a top-10
    table, promotions, and a row of covers with critic scores. The UI uses Avenir and a palette of
    dark grays (#1E1E1E, #3A3A3A), keeping the #0084FF blue for actions and active states only. On
    mobile, the platform tabs stay pinned below the header.
  outcome: >-
    Desktop home screen, mobile version, style guide, and wireframe published on Behance.
