es:
  title: SYLVARAN RPG
  tagline: ACTION RPG EN PIXEL ART
  summary: >-
    Sylvaran es un RPG de acción y fantasía oscura para navegador, hecho con Phaser 3 y Vite. Kael,
    el último de una orden extinta, debe purificar santuarios en un mundo corrompido por la diosa
    caída Nihzara. Diseñé la historia y las mecánicas, y programé todos los sistemas del juego; ya
    se puede jugar de principio a fin del Acto I, salvo el jefe final.
  challenge:
    - >-
      Combate, diálogos, misiones, inventario y guardado tenían que funcionar juntos sin acoplarse
      entre sí, para poder añadir mecánicas y regiones sin reescribir lo que ya existía.
    - >-
      El combate en tiempo real debía sentirse con peso: hitbox, stamina, retroceso, screenshake y
      sonido tenían que estar sincronizados en cada golpe.
    - >-
      Los mapas debían crecer sin editarlos a mano tile por tile, y el estado de la partida tenía
      que sobrevivir a los cambios de escena y a recargar el juego.
  approach: >-
    Organicé el juego en escenas de Phaser (Boot, Preload, Menu, mundo, HUD, diálogo, inventario,
    Game Over) que se comunican por un EventBus y un Registry tipados, para que ningún sistema
    dependa directamente de otro. Migré el código a TypeScript de forma gradual y añadí ESLint y
    Prettier. Los diálogos son árboles declarativos con opciones que activan flags y avanzan
    misiones. Los mapas se cargan desde Tiled con capas de portales, enemigos y zonas de daño, y el
    de Silentia lo genero con un script reproducible. Los enemigos tienen IA propia y sueltan orbes
    de XP con atracción magnética.
  outcome: >-
    Versión 0.4.0 publicada en GitHub: 2 mapas conectados, 3 tipos de enemigo, 2 NPC con diálogo,
    sistema de misiones, inventario y guardado con autosave y 3 ranuras manuales.
en:
  title: SYLVARAN RPG
  tagline: PIXEL ART ACTION RPG
  summary: >-
    Sylvaran is a dark fantasy action RPG for the browser, built with Phaser 3 and Vite. Kael, the
    last member of an extinct order, must purify sanctuaries in a world corrupted by the fallen
    goddess Nihzara. I designed the story and mechanics and programmed every game system; Act I is
    playable end to end, except for the final boss.
  challenge:
    - >-
      Combat, dialogue, quests, inventory and saving had to work together without being coupled, so
      new mechanics and regions could be added without rewriting what already existed.
    - >-
      Real-time combat needed weight: hitbox, stamina, knockback, screen shake and sound had to stay
      in sync on every hit.
    - >-
      Maps had to grow without hand-editing every tile, and game state had to survive scene changes
      and page reloads.
  approach: >-
    I split the game into Phaser scenes (Boot, Preload, Menu, world, HUD, dialogue, inventory, Game
    Over) that talk through a typed EventBus and Registry, so no system depends directly on another.
    I migrated the code to TypeScript gradually and added ESLint and Prettier. Dialogue lives in
    declarative trees whose choices set flags and advance quests. Maps load from Tiled with layers
    for portals, enemies and damage zones, and the Silentia map is produced by a reproducible
    generator script. Enemies have their own AI and drop XP orbs that drift toward the player.
  outcome: >-
    Version 0.4.0 on GitHub: 2 connected maps, 3 enemy types, 2 NPCs with dialogue, a quest system,
    inventory, and saving with autosave plus 3 manual slots.
