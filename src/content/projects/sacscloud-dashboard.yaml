es:
  title: DASHBOARD SACSCLOUD
  tagline: DASHBOARD SAAS DE COMERCIO
  summary: >-
    SacsCloud es una plataforma SaaS mexicana para gestionar ventas en punto de venta, marketplaces,
    e-commerce y redes sociales. Entre 2020 y 2023 trabajé en su equipo rediseñando los dashboards
    del producto y estableciendo sistemas de diseño reutilizables.
  challenge:
    - >-
      El panel de inicio debía resumir el estado de un negocio que vende por varios canales a la
      vez, sin convertirse en una pared de métricas.
    - >-
      Había que separar lo que requiere acción inmediata (pedidos, pagos, stock) de la información
      de consulta.
    - >-
      Con muchas pantallas y módulos en evolución, hacían falta componentes reutilizables para
      mantener la coherencia del producto.
  approach: >-
    Organicé el dashboard en tres columnas: navegación lateral agrupada por módulos y canales
    (catálogo, inventario, punto de venta, marketplaces, e-commerce, social commerce), contenido
    principal y una columna de resumen de ventas. Arriba, un saludo personalizado y filtros por
    sucursal y fechas; debajo, un bloque de avisos con las acciones pendientes y luego los
    indicadores de desempeño. El total de ventas se muestra con importe en MXN, número de pedidos y
    una gráfica de barras apiladas. Todo se construye sobre un tema oscuro y componentes
    compartidos (tarjetas, selectores, listas de acción) que reutilicé en otras vistas.
  outcome: >-
    Dashboard presentado en Behance como parte de mi trabajo en SacsCloud.
en:
  title: DASHBOARD SACSCLOUD
  tagline: COMMERCE SAAS DASHBOARD
  summary: >-
    SacsCloud is a Mexican SaaS platform for managing sales across point of sale, marketplaces,
    e-commerce and social channels. From 2020 to 2023 I worked on its team, redesigning the
    product's dashboards and establishing reusable design systems.
  challenge:
    - >-
      The home panel had to summarize a business selling across several channels at once without
      becoming a wall of metrics.
    - >-
      Items needing immediate action (orders, payments, stock) had to be separated from reference
      information.
    - >-
      With many screens and evolving modules, the product needed reusable components to stay
      consistent.
  approach: >-
    I organized the dashboard into three columns: side navigation grouped by modules and channels
    (catalog, inventory, point of sale, marketplaces, e-commerce, social commerce), main content, and
    a sales summary column. At the top sit a personalized greeting and filters by branch and date;
    below, an alerts block with pending actions, followed by performance indicators. Total sales show
    the amount in MXN, the order count and a stacked bar chart. Everything is built on a dark theme
    and shared components (cards, selectors, action lists) that I reused across other views.
  outcome: >-
    Dashboard showcased on Behance as part of my work at SacsCloud.
