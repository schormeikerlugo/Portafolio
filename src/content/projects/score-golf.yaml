es:
  title: SCORE GOLF APP
  tagline: APP MÓVIL DE PUNTUACIÓN DE GOLF
  summary: >-
    Concepto de app móvil para llevar la puntuación de una ronda de golf, analizar el juego y
    competir con amigos. Diseñé el flujo completo: registro y acceso, configuración de la partida,
    registro hoyo a hoyo, tabla de puntuación, pantalla de victoria, historial, estadísticas y
    amigos.
  challenge:
    - >-
      Registrar cada hoyo implica varios datos (golpes, putts, penalizaciones, dirección en la
      calle) y se hace de pie en el campo. Tenía que ser rápido y con el pulgar.
    - >-
      Una partida puede tener varios jugadores, y la tabla de puntuación debía comparar a todos sin
      volverse ilegible en una pantalla pequeña.
    - >-
      Además de registrar, la app ofrece estadísticas, historial y amigos. Todo eso no podía
      entorpecer la acción principal: jugar.
  approach: >-
    En la pantalla de hoyo, cada dato tiene su fila con botones de menos y más, y la dirección del
    tiro se marca con iconos de flecha; abajo, el botón Guardar queda entre las flechas para cambiar
    de hoyo. La tabla de puntuación fija la fila de par arriba y la columna de total a la derecha,
    con puntos de color para marcar cada tipo de golpe. La navegación inferior tiene tres pestañas y
    el botón central hexagonal de «Jugar» destaca sobre estadísticas y amigos. La paleta verde y
    blanca usa el verde intenso solo en acciones.
  outcome: >-
    Flujo de app móvil de más de una docena de pantallas publicado en Behance.
en:
  title: SCORE GOLF APP
  tagline: GOLF SCORING MOBILE APP
  summary: >-
    A mobile app concept for keeping score during a round of golf, analyzing your game, and
    competing with friends. I designed the full flow: sign-up and login, match setup, hole-by-hole
    entry, scorecard, win screen, history, stats, and friends.
  challenge:
    - >-
      Logging each hole involves several inputs (strokes, putts, penalties, fairway direction) and
      happens standing on the course. It had to be quick and thumb-friendly.
    - >-
      A match can have several players, and the scorecard had to compare them all without becoming
      unreadable on a small screen.
    - >-
      Beyond scoring, the app offers stats, history, and friends. None of that could get in the way
      of the main action: playing.
  approach: >-
    On the hole screen, each input gets its own row with minus and plus buttons, and shot direction
    is marked with arrow icons; at the bottom, the Save button sits between the arrows that move
    between holes. The scorecard pins the par row at the top and the total column on the right, with colored
    dots marking each shot type. Bottom navigation has three tabs, with a central hexagonal "Play"
    button standing out over stats and friends. The green-and-white palette keeps the strong green
    for actions only.
  outcome: >-
    Mobile app flow of more than a dozen screens published on Behance.
