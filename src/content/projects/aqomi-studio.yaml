es:
  title: AQOMI STUDIO
  tagline: SITIO WEB DE AGENCIA DE BRANDING
  summary: >-
    Sitio web de AQOMI Studios, agencia de branding y diseño con la que trabajé entre 2023 y 2025.
    Lo construí en dos etapas: primero como una SPA en JavaScript puro con Vite y después como un
    sitio en Astro, con portafolio de casos de estudio y formulario de contacto.
  challenge:
    - >-
      Una agencia de diseño se juzga por su web: animaciones, fondos y transiciones tenían que verse
      cuidados sin volver lento el sitio.
    - >-
      El portafolio reúne más de 20 casos de estudio. Había que presentarlos con coherencia y poder
      añadir nuevos sin duplicar plantillas.
    - >-
      La primera versión cargaba el contenido en el navegador, lo que dificultaba el SEO y el
      mantenimiento a medida que el sitio crecía.
  approach: >-
    En la v1 escribí una SPA sin frameworks: un router propio con hooks de ciclo de vida
    (onPageActivate, registerCleanup), parciales HTML inyectados por ruta, fondos mesh gradient en
    WebGL, cursor personalizado y apariciones con IntersectionObserver. Vite compila con compresión
    Gzip y Brotli, y un script de prerenderizado genera HTML estático por página. En la v2 migré el
    sitio a Astro: separé las páginas en componentes, extraje el CSS por página y monté los casos
    de estudio en una ruta dinámica alimentada por un archivo de datos. El formulario envía correos
    con Resend desde un endpoint en Vercel.
  outcome: >-
    La v2 está publicada en Vercel con portada, índice de trabajos con filtros y 24 casos de
    estudio; el código de la v1 está en GitHub.
en:
  title: AQOMI STUDIO
  tagline: BRANDING AGENCY WEBSITE
  summary: >-
    Website for AQOMI Studios, the branding and design agency I worked with from 2023 to 2025. I
    built it in two stages: first as a vanilla JavaScript SPA with Vite, then as an Astro site with
    a case study portfolio and a contact form.
  challenge:
    - >-
      A design agency is judged by its website: animations, backgrounds and transitions had to look
      polished without slowing the site down.
    - >-
      The portfolio holds more than 20 case studies. They needed a consistent presentation, and new
      ones had to be added without duplicating templates.
    - >-
      The first version loaded content in the browser, which made SEO and maintenance harder as the
      site grew.
  approach: >-
    For v1 I wrote a framework-free SPA: a custom router with lifecycle hooks (onPageActivate,
    registerCleanup), HTML partials injected per route, WebGL mesh gradient backgrounds, a custom
    cursor and IntersectionObserver reveals. Vite builds it with Gzip and Brotli compression, and a
    prerender script outputs static HTML for each page. For v2 I migrated the site to Astro: I split
    pages into components, extracted per-page CSS and moved the case studies to a dynamic route fed
    by a data file. The contact form sends email through Resend from a Vercel endpoint.
  outcome: >-
    v2 is live on Vercel with a homepage, a filterable work index and 24 case studies; the v1 code
    is on GitHub.
