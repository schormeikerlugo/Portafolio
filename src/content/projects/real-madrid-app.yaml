es:
  title: REAL MADRID APP
  tagline: SPORTS MOBILE CONCEPT
  summary: >-
    Real Madrid App es un concepto de aplicación móvil oficial para el club más laureado del fútbol
    europeo, diseñada para centralizar noticias, estadísticas de jugadores, calendario de partidos y
    experiencias de fan engagement en una sola plataforma. La app se dirige a una base global de más
    de 500 millones de aficionados que consumen contenido del club desde múltiples fuentes
    dispersas. Su identidad visual debía reflejar la elegancia y el prestigio histórico de la marca
    Real Madrid, diferenciándose de las apps deportivas genéricas que priorizan la cantidad de
    contenido sobre la calidad de la experiencia.
  challenge:
    - >-
      Las apps deportivas oficiales priorizan volumen de contenido sobre experiencia del usuario. La
      app actual muestra 6 banners, 3 carruseles y 12 enlaces en la home sin jerarquía clara de
      lectura.
    - >-
      Los fans quieren acceso a resultados en vivo en menos de 2 toques durante los partidos. Las
      apps actuales requieren 4+ pasos para llegar al marcador.
    - >-
      La app debe reflejar la elegancia y el prestigio histórico del Real Madrid. Una interfaz
      genérica devalúa la percepción de un club con 15 Champions League.
  approach: >-
    El diseño premium adopta los tonos blancos y dorados de la identidad del club, con tipografía
    serif para títulos que evoca la tradición institucional del Real Madrid. El feed de noticias
    presenta cards visuales con fotografía editorial de alta calidad, mientras los perfiles de
    jugadores despliegan estadísticas interactivas con gráficos radiales de rendimiento por
    competición. El calendario incluye cuenta regresiva para el próximo partido y acceso directo al
    modo en vivo, que transforma la interfaz en un dashboard de seguimiento con marcador, alineación
    y eventos minuto a minuto.
en:
  title: REAL MADRID APP
  tagline: SPORTS MOBILE CONCEPT
  summary: >-
    Real Madrid App is an official mobile application concept for Europe's most decorated football
    club, designed to centralize news, player statistics, match calendar, and fan engagement
    experiences in a single platform. The app targets a global base of over 500 million fans who
    consume club content from multiple scattered sources. Its visual identity had to reflect the
    elegance and historic prestige of the Real Madrid brand, setting itself apart from generic
    sports apps that prioritize content volume over experience quality.
  challenge:
    - >-
      Official sports apps prioritize content volume over user experience. The current app displays
      6 banners, 3 carousels, and 12 links on the home screen with no clear reading hierarchy.
    - >-
      Fans want access to live results in under 2 taps during matches. Current apps require 4+ steps
      to reach the scoreboard.
    - >-
      The app must reflect the elegance and historic prestige of Real Madrid. A generic interface
      devalues the perception of a club with 15 Champions League titles.
  approach: >-
    The premium design adopts the white and gold tones of the club's identity, with serif typography
    for titles that evokes Real Madrid's institutional tradition. The news feed presents visual
    cards with high-quality editorial photography, while player profiles display interactive
    statistics with radial performance charts by competition. The calendar includes a countdown to
    the next match and direct access to live mode, which transforms the interface into a tracking
    dashboard with scoreboard, lineup, and minute-by-minute events.
