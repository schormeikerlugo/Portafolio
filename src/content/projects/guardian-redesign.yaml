es:
  title: GUARDIAN REDESIGN
  tagline: NEWS WEB REDESIGN
  summary: >-
    Guardian Redesign es una propuesta de rediseño del sitio web de The Guardian concebida durante
    la pandemia de COVID-19. El proyecto prioriza la legibilidad y accesibilidad de información de
    salud pública en un contexto de saturación informativa. Su enfoque diferenciador se centra en la
    jerarquización visual de noticias verificadas frente al flujo constante de información no
    contrastada que dominaba los medios digitales.
  challenge:
    - >-
      Durante la pandemia, los sitios de noticias publicaban más de 200 artículos diarios sin
      jerarquización visual, imposibilitando distinguir actualizaciones críticas de opinión.
    - >-
      Los usuarios necesitaban localizar datos de COVID específicos de su región en menos de 10
      segundos, pero la estructura del sitio no lo facilitaba.
    - >-
      La desinformación se propagaba 6 veces más rápido que las noticias verificadas; el diseño
      debía reforzar visualmente la credibilidad de las fuentes.
  approach: >-
    El rediseño incorpora una sección dedicada a COVID-19 con visualización de datos en tiempo real
    segmentados por región y nivel de alerta. Las cards de noticias incluyen indicadores de
    verificación con sellos de fuente y fecha de última actualización. La tipografía se amplió un
    15% respecto al diseño original para facilitar sesiones de lectura prolongada. Además, un modo
    de lectura simplificada elimina elementos decorativos y reduce la interfaz al contenido
    esencial.
en:
  title: GUARDIAN REDESIGN
  tagline: NEWS WEB REDESIGN
  summary: >-
    Guardian Redesign is a redesign proposal for The Guardian's website conceived during the
    COVID-19 pandemic. The project prioritizes the readability and accessibility of public health
    information in a context of information overload. Its differentiating approach focuses on the
    visual hierarchy of verified news over the constant flow of unverified information that
    dominated digital media.
  challenge:
    - >-
      During the pandemic, news sites published over 200 articles daily without visual hierarchy,
      making it impossible to distinguish critical updates from opinion.
    - >-
      Users needed to locate region-specific COVID data in under 10 seconds, but the site structure
      did not facilitate that.
    - >-
      Misinformation spread 6 times faster than verified news; the design had to visually reinforce
      the credibility of sources.
  approach: >-
    The redesign incorporates a dedicated COVID-19 section with real-time data visualization
    segmented by region and alert level. News cards include verification indicators with source
    badges and last-updated timestamps. Typography was enlarged by 15% compared to the original
    design to support extended reading sessions. Additionally, a simplified reading mode strips away
    decorative elements and reduces the interface to essential content.
