es:
  title: GUARDIAN REDESIGN
  tagline: TIENDA WEB DE MASCARILLAS
  summary: >-
    Rediseño no oficial de la web de Guardian, una marca de mascarillas de neopreno, hecho en 2020
    como shot para Dribbble. Diseñé la pantalla principal de producto con su carrusel y la
    navegación de la tienda.
  challenge:
    - >-
      Presentar un producto simple, una mascarilla negra, con suficiente interés visual para
      sostener toda la pantalla.
    - >-
      Combinar en una sola vista la foto de producto, la foto de uso y la explicación de materiales.
    - >-
      Comunicar confianza en un producto sanitario sin que la página pareciera clínica.
  approach: >-
    Dividí el hero en dos: a la izquierda la mascarilla recortada sobre una forma azul ondulada con
    cruces como patrón, y a la derecha una foto grande de una persona usándola con miniatura de
    otro ángulo. Debajo del producto van el nombre, una línea de beneficios y la descripción, con
    indicadores del carrusel. Mantuve el azul como color de marca y acción, el header con
    Productos, Colección y Afiliado, y redes sociales en vertical a la izquierda. El footer oscuro
    reúne los medios de pago aceptados y el selector de idioma.
  outcome: >-
    Shot publicado en Dribbble con la pantalla principal de producto.
en:
  title: GUARDIAN REDESIGN
  tagline: FACE MASK ONLINE STORE
  summary: >-
    An unofficial redesign of the website for Guardian, a neoprene face mask brand, made in 2020 as
    a Dribbble shot. I designed the main product screen with its carousel and the store navigation.
  challenge:
    - >-
      Presenting a simple product, a black face mask, with enough visual interest to carry the whole
      screen.
    - >-
      Combining product photo, in-use photo and material description in a single view.
    - >-
      Conveying trust for a health product without the page feeling clinical.
  approach: >-
    I split the hero in two: on the left the cut-out mask over a wavy blue shape with a cross
    pattern, and on the right a large photo of someone wearing it with a thumbnail from another
    angle. Below the product sit the name, a benefit line and the description, with carousel
    indicators. Blue stays as the brand and action color, the header holds Products, Collection and
    Affiliate, and social links run vertically on the left. The dark footer groups accepted payment
    methods and the language selector.
  outcome: >-
    Shot published on Dribbble showing the main product screen.
