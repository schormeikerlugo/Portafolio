es:
  title: LEAGUE OF LEGENDS
  tagline: DASHBOARD DE ESTADÍSTICAS
  summary: >-
    Concepto de panel de estadísticas para jugadores de League of Legends. En una sola pantalla
    reúne el perfil del invocador, sus campeones más jugados, la clasificatoria, el historial de
    partidas y un análisis de estilo de juego. Lo diseñé en Adobe XD y lo publiqué como archivo
    descargable.
  challenge:
    - >-
      Un jugador acumula muchísimos datos por partida. El panel tenía que mostrar los importantes
      sin parecer una hoja de cálculo.
    - >-
      Cada tipo de dato pedía un gráfico distinto (comparación entre campeones, ranking, historial,
      perfil de habilidades) y todos debían convivir en la misma vista.
    - >-
      El panel tenía que sentirse parte del universo del juego y no una herramienta genérica.
  approach: >-
    Ordené la pantalla de lo general a lo particular: perfil y rango arriba, luego campeones y
    clasificatoria, después historial de partidas y al final las estadísticas detalladas. Los cinco
    campeones principales se comparan con barras agrupadas de partidas, victorias y derrotas. El
    historial muestra cada partida en una fila con campeón, build, KDA, duración y resultado en verde
    o rojo. Un gráfico radial resume ocho rasgos del jugador (combate, farmeo, visión, agresividad…)
    junto a barras con los valores exactos. Paneles oscuros y semitransparentes dejan ver el arte
    del juego de fondo.
  outcome: >-
    Dashboard de una pantalla publicado en Behance como descarga gratuita para Adobe XD.
en:
  title: LEAGUE OF LEGENDS
  tagline: PLAYER STATS DASHBOARD
  summary: >-
    A stats dashboard concept for League of Legends players. A single screen brings together the
    summoner profile, most-played champions, ranked standings, match history, and a play-style
    breakdown. I designed it in Adobe XD and published it as a downloadable file.
  challenge:
    - >-
      Players pile up huge amounts of data per match. The dashboard had to surface what matters
      without looking like a spreadsheet.
    - >-
      Each kind of data called for a different chart (champion comparison, ranking, history, skill
      profile), and they all had to live in one view.
    - >-
      The dashboard needed to feel part of the game's world rather than a generic tool.
  approach: >-
    I ordered the screen from general to specific: profile and rank at the top, then champions and
    ranked standings, then match history, and detailed stats at the bottom. The top five champions
    are compared with grouped bars for games, wins, and losses. Match history shows one row per game
    with champion, build, KDA, duration, and a green or red result. A radar chart sums up eight
    player traits (fighting, farming, vision, aggression…) next to bars with the exact values. Dark,
    semi-transparent panels let the game's artwork show through in the background.
  outcome: >-
    Single-screen dashboard published on Behance as a free Adobe XD download.
