es:
  title: DEATH STRANDING
  tagline: WEB CONCEPTUAL DE VIDEOJUEGO
  summary: >-
    Concepto no oficial de web promocional para Death Stranding. Esta pieza muestra la sección de
    historia: un hero a pantalla completa con la premisa del juego, navegación entre capítulos y una
    tira de imágenes de escenas clave. La publiqué en Dribbble como parte de una serie.
  challenge:
    - >-
      El juego tiene una estética muy reconocible. La web debía evocarla sin copiar sus menús ni
      saturar la pantalla.
    - >-
      Una sola vista tenía que dar acceso a varios capítulos de la historia sin que el texto
      compitiera con las imágenes.
    - >-
      El texto blanco tenía que leerse sobre una escena de fuego y tonos muy cálidos.
  approach: >-
    Dividí la pantalla en tres zonas: a la izquierda una barra con redes sociales e idioma, en el
    centro el titular y la sinopsis sobre la escena, y a la derecha una columna numerada de
    capítulos con miniaturas. Un velo oscuro en el lado del texto asegura el contraste sin apagar la
    imagen. Los iconos de manos y los trazos finos remiten al imaginario del juego sin usar sus
    elementos literales. La navegación superior se reduce a tres opciones: inicio, reserva e
    historia.
  outcome: >-
    Pantalla de la sección de historia publicada en Dribbble.
en:
  title: DEATH STRANDING
  tagline: GAME WEBSITE CONCEPT
  summary: >-
    An unofficial promotional website concept for Death Stranding. This piece shows the story
    section: a full-screen hero with the game's premise, chapter navigation, and a strip of key
    scene images. I published it on Dribbble as part of a series.
  challenge:
    - >-
      The game has a very recognizable look. The site had to evoke it without copying its menus or
      cluttering the screen.
    - >-
      A single view had to give access to several story chapters without the text fighting the
      imagery.
    - >-
      White text had to stay readable over a fiery, very warm scene.
  approach: >-
    I split the screen into three zones: a left rail with social links and language, the headline
    and synopsis in the center over the scene, and a numbered chapter column with thumbnails on the
    right. A dark overlay on the text side keeps contrast without dulling the image. Hand icons and
    thin strokes nod to the game's imagery without using its literal elements. Top navigation is
    reduced to three options: home, pre-order, and story.
  outcome: >-
    Story section screen published on Dribbble.
