es:
  title: PLAYSTATION ECOMMERCE
  tagline: PÁGINA DE PRODUCTO PLAYSTATION
  summary: >-
    Concepto no oficial de página de producto para una tienda de PlayStation, centrado en el mando
    DualShock 4. En una pantalla reúne descripción, selector de color, cantidad, precio, compra,
    vistas del producto y acceso al tráiler.
  challenge:
    - >-
      Una página de producto tiene que poner el foco en el objeto y, a la vez, tener a mano todo lo
      necesario para comprarlo.
    - >-
      La identidad de PlayStation es muy reconocible. Quería usarla sin que la página pareciera un
      anuncio y no una tienda.
    - >-
      Opciones como color y cantidad tenían que poder cambiarse sin salir de la vista principal.
  approach: >-
    Dividí la pantalla en diagonal: a la izquierda, sobre blanco, el texto y los controles de compra;
    a la derecha, sobre el azul de la marca, la foto grande del mando con tres miniaturas de otros
    ángulos. Los símbolos de PlayStation (triángulo, círculo, cruz y cuadrado) flotan como textura de
    fondo. El color se elige con pastillas, la cantidad con un selector numérico y el precio va
    junto al botón de compra para leerse en un solo vistazo. El carrito y las notificaciones quedan
    en la cabecera.
  outcome: >-
    Pantalla de producto publicada en Dribbble.
en:
  title: PLAYSTATION ECOMMERCE
  tagline: PLAYSTATION PRODUCT PAGE
  summary: >-
    An unofficial product page concept for a PlayStation store, focused on the DualShock 4
    controller. One screen brings together description, color picker, quantity, price, purchase,
    product views, and a trailer link.
  challenge:
    - >-
      A product page has to keep the focus on the object while keeping everything needed to buy it
      within reach.
    - >-
      PlayStation's identity is highly recognizable. I wanted to use it without the page feeling
      like an ad instead of a store.
    - >-
      Options such as color and quantity had to be adjustable without leaving the main view.
  approach: >-
    I split the screen diagonally: text and purchase controls on white to the left, and a large
    photo of the controller on brand blue to the right, with three thumbnails of other angles. The
    PlayStation symbols (triangle, circle, cross, and square) float as background texture. Color is
    picked with swatches, quantity with a stepper, and the price sits next to the buy button so it
    reads at a glance. Cart and notifications live in the header.
  outcome: >-
    Product screen published on Dribbble.
