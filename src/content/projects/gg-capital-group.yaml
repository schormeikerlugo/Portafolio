es:
  title: G&G CAPITAL GROUP
  tagline: WEB CORPORATIVA FINANCIERA
  summary: >-
    Concepto de web corporativa para G&G Capital Group, una firma de asesoría financiera
    internacional. Diseñé la estructura de navegación y la sección "Quiénes somos", publicada como
    segunda parte de una serie en Dribbble.
  challenge:
    - >-
      Una firma financiera necesita transmitir seriedad, pero la página no debía verse como otra
      plantilla corporativa azul.
    - >-
      El texto institucional es largo; había que presentarlo sin que la sección se convirtiera en
      un bloque de párrafos.
    - >-
      El logo dorado y el azul corporativo tenían que convivir sin competir entre sí.
  approach: >-
    Encerré el contenido en una tarjeta clara con borde dorado fino, flotando sobre un fondo
    dividido en diagonal entre blanco y gris carbón. La sección combina una foto de rascacielos con
    marco azul, una etiqueta "Quiénes somos" en bloque azul sesgado y el texto en un panel con
    scroll propio para no alargar la página. Usé el dorado solo para el logo, el ítem activo del
    menú y los bordes, y el azul para títulos y acciones. Los accesos secundarios (compartir,
    redes, idioma) quedan en los márgenes laterales en vertical.
  outcome: >-
    Shot publicado en Dribbble con la sección "Quiénes somos".
en:
  title: G&G CAPITAL GROUP
  tagline: FINANCIAL CORPORATE WEBSITE
  summary: >-
    A corporate website concept for G&G Capital Group, an international financial advisory firm. I
    designed the navigation structure and the "About us" section, published as the second part of a
    Dribbble series.
  challenge:
    - >-
      A financial firm needs to come across as serious, yet the page shouldn't look like yet another
      blue corporate template.
    - >-
      The institutional copy is long; it had to be presented without the section turning into a
      block of paragraphs.
    - >-
      The gold logo and the corporate blue had to coexist without competing.
  approach: >-
    I placed the content on a light card with a thin gold border, floating over a background split
    diagonally between white and charcoal. The section pairs a skyscraper photo with a blue frame,
    an "About us" label on a slanted blue block, and the copy in a panel with its own scroll so the
    page doesn't grow. Gold is reserved for the logo, the active menu item and the borders, while
    blue handles headings and actions. Secondary links (share, social, language) sit vertically in
    the side margins.
  outcome: >-
    Shot published on Dribbble showing the "About us" section.
