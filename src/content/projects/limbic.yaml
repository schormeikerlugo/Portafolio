es:
  title: LIMBIC
  tagline: WEB INSTITUCIONAL DE AGENCIA TECH
  summary: >-
    Limbic es una empresa chilena de desarrollo tecnológico (inteligencia artificial, blockchain,
    chatbots, apps). Como Web Designer en Limbic diseñé su sitio institucional de una sola página,
    desde el hero hasta el formulario de contacto.
  challenge:
    - >-
      La empresa ofrece servicios muy técnicos y variados; el sitio debía presentarlos de forma
      comprensible para clientes no técnicos.
    - >-
      En una sola página convivían misión y visión, servicios, portafolio, testimonios, equipo,
      blog y contacto, y cada bloque tenía que distinguirse del anterior.
    - >-
      La identidad necesitaba sentirse tecnológica sin caer en un sitio frío y corporativo.
  approach: >-
    Partí del isotipo hexagonal y su degradado magenta-violeta-azul y lo convertí en el hilo de toda
    la página. Alterné secciones oscuras y claras separadas por curvas, de modo que cada bloque se
    lee como una pantalla propia. Los servicios se presentan en una cuadrícula de iconos con título
    corto, y el portafolio en un carrusel filtrable por categoría y orden alfabético. Para la parte
    humana diseñé un slider de testimonios, fichas del equipo con foto y biografía, contadores y un
    blog con vídeo destacado, cerrando con un formulario de contacto sobre fotografía.
en:
  title: LIMBIC
  tagline: TECH AGENCY CORPORATE SITE
  summary: >-
    Limbic is a Chilean technology company (artificial intelligence, blockchain, chatbots, apps). As
    Web Designer at Limbic I designed its one-page corporate website, from the hero to the contact
    form.
  challenge:
    - >-
      The company offers highly technical and varied services; the site had to present them in a way
      non-technical clients could follow.
    - >-
      A single page held mission and vision, services, portfolio, testimonials, team, blog and
      contact, and each block needed to stand apart from the previous one.
    - >-
      The identity had to feel technological without becoming a cold, corporate site.
  approach: >-
    I started from the hexagonal mark and its magenta-violet-blue gradient and made it the thread
    running through the whole page. Dark and light sections alternate, separated by curves, so each
    block reads as its own screen. Services sit in an icon grid with short titles, and the portfolio
    in a carousel filterable by category and alphabetical order. For the human side I designed a
    testimonial slider, team cards with photo and bio, counters and a blog with a featured video,
    closing with a contact form over photography.
