es:
  title: BLACKHOLE DEFI
  tagline: UI DE YIELD FARMING DEFI
  summary: >-
    Concepto de interfaz para BlackHole, una plataforma DeFi de farming en BNB Chain. Diseñé la
    página principal con métricas del token, el listado de farms y la herramienta Zap para
    convertir tokens en LP, todo bajo una temática espacial de agujeros negros y planetas.
  challenge:
    - >-
      Las interfaces DeFi suelen copiar la misma plantilla de tarjetas y formularios. Quería que
      BlackHole tuviera identidad propia sin cambiar los patrones que los usuarios ya conocen.
    - >-
      El fondo ilustrado es muy cargado. Las cifras de TVL, market cap y APR tenían que seguir
      siendo legibles encima.
    - >-
      El Zap convierte un token en un par de liquidez en un solo paso. El formulario debía dejar
      claro qué se entrega y qué se recibe.
  approach: >-
    El agujero negro funciona como logo, como fondo del hero y como recurso visual en las
    transiciones entre secciones, con planetas y meteoritos ilustrados a los lados. Los datos viven
    en paneles translúcidos con texto blanco y acentos cian, para separarlos del fondo violeta. Las
    tarjetas de farm mantienen el orden habitual en DeFi (par, APR, ganado, en stake y acción), así
    que la novedad está en la piel y no en el flujo. El Zap usa un formulario vertical de origen a
    destino con el botón MAX y el saldo junto al campo.
  outcome: >-
    Concepto de landing, listado de farms y pantalla Zap publicado en Behance.
en:
  title: BLACKHOLE DEFI
  tagline: DEFI YIELD FARMING UI
  summary: >-
    An interface concept for BlackHole, a DeFi farming platform on BNB Chain. I designed the home
    page with token metrics, the farms list, and the Zap tool that converts tokens into LP pairs,
    all wrapped in a space theme of black holes and planets.
  challenge:
    - >-
      DeFi interfaces tend to reuse the same card-and-form template. I wanted BlackHole to have its
      own identity without changing the patterns users already know.
    - >-
      The illustrated background is busy. TVL, market cap, and APR figures had to stay readable on
      top of it.
    - >-
      Zap turns a single token into a liquidity pair in one step. The form had to make clear what
      goes in and what comes out.
  approach: >-
    The black hole works as the logo, the hero background, and a visual device between sections,
    framed by illustrated planets and meteors. Data sits on translucent panels with white text and
    cyan accents to separate it from the purple background. Farm cards keep the familiar DeFi order
    (pair, APR, earned, staked, action), so the novelty lives in the skin rather than the flow. Zap
    uses a vertical source-to-destination form with a MAX button and balance next to the input.
  outcome: >-
    Concept covering the landing page, farms list, and Zap screen, published on Behance.
