es:
  title: DASHBOARD SACSCLOUD
  tagline: SAAS ENTERPRISE
  summary: >-
    Dashboard SacsCloud es el panel principal de una plataforma SaaS de gestión empresarial
    utilizada por más de 200 empresas en México. El rediseño optimiza la visualización de KPIs y
    flujos de trabajo diarios para tres perfiles de usuario distintos: gerentes, operadores y
    administradores. Su enfoque modular permite que cada rol acceda a una vista personalizada de los
    mismos datos, eliminando el ruido informativo que generaba el diseño anterior.
  challenge:
    - >-
      El dashboard anterior mostraba más de 40 métricas en una sola vista sin priorización ni
      agrupación lógica, forzando al usuario a buscar manualmente cada dato.
    - >-
      Los usuarios reportaban fatiga visual después de 2 horas de uso continuado; el contraste
      insuficiente y la densidad de información agravaban el problema.
    - >-
      Cada rol (gerente, operador, admin) necesitaba vistas completamente diferentes, pero el
      sistema mostraba los mismos 40+ widgets a todos los perfiles por igual.
  approach: >-
    El dashboard modular permite que cada rol configure sus widgets visibles y su disposición en la
    grilla. El sistema de alertas codifica por color la prioridad de cada notificación, reduciendo
    el tiempo de reacción ante incidencias críticas. Los gráficos interactivos soportan drill-down
    de tres niveles para explorar datos desde la vista general hasta el detalle granular. El modo
    oscuro, diseñado para jornadas laborales extensas, reduce la fatiga visual y el consumo
    energético en pantallas OLED.
en:
  title: DASHBOARD SACSCLOUD
  tagline: SAAS ENTERPRISE
  summary: >-
    Dashboard SacsCloud is the main panel of a SaaS enterprise management platform used by over 200
    companies in Mexico. The redesign optimizes KPI visualization and daily workflows for three
    distinct user profiles: managers, operators, and administrators. Its modular approach allows
    each role to access a customized view of the same data, eliminating the information noise that
    the previous design generated.
  challenge:
    - >-
      The previous dashboard displayed over 40 metrics in a single view without prioritization or
      logical grouping, forcing users to search manually for each data point.
    - >-
      Users reported visual fatigue after 2 hours of continuous use; insufficient contrast and
      information density worsened the problem.
    - >-
      Each role (manager, operator, admin) needed completely different views, but the system
      displayed the same 40+ widgets to all profiles equally.
  approach: >-
    The modular dashboard allows each role to configure its visible widgets and their grid
    arrangement. The alert system color-codes the priority of each notification, reducing reaction
    time to critical incidents. Interactive charts support three-level drill-down to explore data
    from the general overview to granular detail. Dark mode, designed for extended work sessions,
    reduces visual fatigue and energy consumption on OLED screens.
