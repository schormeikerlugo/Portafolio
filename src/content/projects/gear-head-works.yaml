es:
  title: GEAR HEAD WORKS
  tagline: CONCEPTO DE E-COMMERCE TÁCTICO
  summary: >-
    Concepto de tienda online para Gear Head Works, una marca de accesorios y equipamiento táctico.
    Rediseñé de forma no oficial la home, la ficha de producto y la vista rápida, con un tema oscuro
    pensado para el tipo de producto.
  challenge:
    - >-
      El catálogo mezcla piezas pequeñas, mochilas y equipo completo; había que mostrarlo con un
      formato común sin que los productos se perdieran.
    - >-
      Un tema oscuro con fotos de producto muy distintas entre sí corría el riesgo de verse
      desordenado.
    - >-
      Las fichas técnicas son largas y debían convivir con precio, galería y compra sin saturar la
      página.
  approach: >-
    Usé un fondo gris oscuro con el naranja como único color de acento para precios, etiquetas de
    "New" y botones. Los productos destacados se muestran en tarjetas blancas con esquinas
    redondeadas, que unifican fotos de distinto origen, y cada una lleva accesos directos a
    carrito, favorito y vista rápida. La vista rápida es un modal con galería de miniaturas,
    precio y botón de compra para no salir del listado. En la ficha completa separé la compra arriba
    y las especificaciones y materiales abajo, junto a banners de promociones y productos
    relacionados.
  outcome: >-
    Concepto publicado en Behance con la home, la ficha de producto, el modal de vista rápida y el
    footer.
en:
  title: GEAR HEAD WORKS
  tagline: TACTICAL E-COMMERCE CONCEPT
  summary: >-
    An online store concept for Gear Head Works, a tactical gear and accessories brand. I created an
    unofficial redesign of the home page, product page and quick view, with a dark theme suited to
    the product category.
  challenge:
    - >-
      The catalog mixes small parts, backpacks and full kits; they needed a shared format without
      individual products getting lost.
    - >-
      A dark theme with very different product photos risked looking messy.
    - >-
      Technical specs are long and had to sit alongside price, gallery and checkout without
      cluttering the page.
  approach: >-
    I used a dark gray background with orange as the only accent color for prices, "New" tags and
    buttons. Featured products sit on rounded white cards that unify photos from different sources,
    each with shortcuts to cart, wishlist and quick view. Quick view is a modal with a thumbnail
    gallery, price and buy button so users stay on the listing. On the full product page I placed
    the purchase block at the top and specs and materials below, alongside promo banners and related
    products.
  outcome: >-
    Concept published on Behance with the home page, product page, quick-view modal and footer.
