es:
  title: CALL OF DUTY
  tagline: WEB CONCEPTUAL BLACK OPS III
  summary: >-
    Concepto no oficial de portada web para Call of Duty: Black Ops III. En una sola pantalla reúne
    compra por plataforma, logros multijugador, contenido descargable y un acceso a la campaña,
    alrededor del soldado protagonista.
  challenge:
    - >-
      La portada debía vender el juego y, a la vez, dar acceso rápido a campaña, logros y DLC sin
      convertirse en un catálogo.
    - >-
      El juego sale en cuatro plataformas, y elegir la correcta tenía que ser inmediato.
    - >-
      Sobre un fondo negro con mucha imagen, la jerarquía de botones y textos debía quedar clara.
  approach: >-
    Coloqué al soldado en el centro y repartí la información a los lados: a la izquierda logo,
    selector de plataforma y botón de compra; a la derecha logros y un panel de campaña con su
    sinopsis y botón de reproducción. El naranja de la marca se reserva para acciones, pestaña
    activa y bordes, y el resto de la interfaz queda en blanco y gris sobre negro. Las líneas
    discontinuas y los iconos tipo insignia aportan el tono militar sin recargar. El selector de
    idioma y la clasificación por edad completan la pantalla como en una web oficial.
  outcome: >-
    Pantalla de portada publicada en Dribbble.
en:
  title: CALL OF DUTY
  tagline: BLACK OPS III WEB CONCEPT
  summary: >-
    An unofficial landing page concept for Call of Duty: Black Ops III. A single screen brings
    together platform-specific purchase, multiplayer achievements, downloadable content, and a
    campaign entry point, built around the lead soldier.
  challenge:
    - >-
      The landing page had to sell the game while giving quick access to the campaign,
      achievements, and DLC without turning into a catalog.
    - >-
      The game ships on four platforms, and picking the right one had to be instant.
    - >-
      On a black, image-heavy background, the hierarchy of buttons and text had to stay clear.
  approach: >-
    I placed the soldier at the center and spread information to the sides: logo, platform selector,
    and buy button on the left; achievements and a campaign panel with synopsis and play button on
    the right. The brand's orange is reserved for actions, the active tab, and borders, while the
    rest of the UI stays white and gray on black. Dashed lines and badge-style icons add the
    military tone without clutter. A language switcher and the age rating round out the screen as on
    an official site.
  outcome: >-
    Landing screen published on Dribbble.
