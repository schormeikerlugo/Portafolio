es:
  title: CHUMBI VALLEY
  tagline: WEB CONCEPTUAL DE JUEGO NFT
  summary: >-
    Concepto no oficial de sitio web para Chumbi Valley, un juego NFT de criaturas coleccionables
    ambientado en un bosque mágico. Diseñé una landing larga que presenta la visión, el juego, las
    criaturas, el gameplay, el sistema play-to-earn y la tokenomics.
  challenge:
    - >-
      El sitio tenía que contar mucho contenido (lore, mecánicas, economía y tokens) sin convertirse
      en un documento técnico que nadie lee.
    - >-
      La parte de juego y la parte de criptoeconomía debían convivir en la misma página con un tono
      coherente.
    - >-
      La estética del juego, ilustrada y de cuento, tenía que trasladarse a componentes web
      reutilizables.
  approach: >-
    Organicé la página como un recorrido por el bosque: fondo de follaje oscuro, hojas que caen y
    contenido sobre pergaminos y tablillas de madera. Cada bloque de información usa la misma pieza
    de papel con títulos en tipografía display, así la página se lee por capítulos. Las mecánicas de
    gameplay y las formas de ganar se presentan en rejillas de tarjetas con icono propio, y la
    anatomía de un Chumbi se explica con un diagrama de partes. La tokenomics cierra la página con
    los dos tokens del juego destacados como objetos ilustrados.
  outcome: >-
    Concepto de landing de una sola página publicado en Behance.
en:
  title: CHUMBI VALLEY
  tagline: NFT GAME WEBSITE CONCEPT
  summary: >-
    An unofficial website concept for Chumbi Valley, an NFT game of collectible creatures set in a
    magical forest. I designed a long landing page covering the vision, the game, the creatures,
    gameplay, the play-to-earn system, and tokenomics.
  challenge:
    - >-
      The site had a lot to say (lore, mechanics, economy, and tokens) without turning into a
      technical document nobody reads.
    - >-
      The game side and the crypto-economy side had to share one page with a consistent tone.
    - >-
      The game's illustrated, storybook look had to translate into reusable web components.
  approach: >-
    I structured the page as a walk through the forest: dark foliage background, falling leaves, and
    content laid on parchment and wooden boards. Every information block uses the same paper piece
    with display headings, so the page reads in chapters. Gameplay mechanics and ways to earn are
    shown in card grids with their own icons, and a Chumbi's anatomy is explained with a parts
    diagram. Tokenomics closes the page, with the game's two tokens featured as illustrated objects.
  outcome: >-
    Single-page landing concept published on Behance.
