es:
  title: GEOMAP UI/UX
  tagline: PLATAFORMA DE GESTIÓN DE FLOTAS
  summary: >-
    GeoMap es un concepto de software web para monitorear flotas de vehículos en tiempo real:
    ubicación, estado, conductores, combustible y mensajería. Diseñé la marca, el panel principal y
    los módulos de detalle, y preparé un prototipo navegable.
  challenge:
    - >-
      Un gestor de flota necesita ver el estado de muchos vehículos a la vez y, al mismo tiempo,
      entrar al detalle de uno sin perder el contexto del mapa.
    - >-
      Los datos del vehículo (encendido, velocidad, combustible, CAN bus) son técnicos; había que
      convertirlos en indicadores legibles.
    - >-
      La comunicación con los conductores debía estar dentro de la misma herramienta, no en una app
      aparte.
  approach: >-
    Diseñé un tema oscuro sobre un mapa base apagado, con cian como color de rutas, marcadores y
    acciones, para que el mapa siga siendo el fondo de todo. El panel "Estado de la flota" combina
    una lista de vehículos con indicador de color y una gráfica por días. Cada vehículo abre una
    ficha con pestañas (resumen, historial, eventos, combustible, mantenimiento) y una barra de
    estado con plan, encendido, combustible y gastos. Añadí módulos de conductores, mensajería tipo
    chat y monitoreo de combustible con cargas y descargas marcadas en la gráfica.
  outcome: >-
    Presentación publicada en Behance con la identidad, el dashboard y 6 módulos de detalle, más un
    prototipo del flujo.
en:
  title: GEOMAP UI/UX
  tagline: FLEET MANAGEMENT PLATFORM
  summary: >-
    GeoMap is a web software concept for monitoring vehicle fleets in real time: location, status,
    drivers, fuel and messaging. I designed the brand, the main dashboard and the detail modules, and
    built a clickable prototype.
  challenge:
    - >-
      A fleet manager needs to see the status of many vehicles at once and drill into a single one
      without losing the map context.
    - >-
      Vehicle data (ignition, speed, fuel, CAN bus) is technical; it had to become readable
      indicators.
    - >-
      Communication with drivers had to live inside the same tool, not in a separate app.
  approach: >-
    I designed a dark theme over a muted base map, with cyan for routes, markers and actions, so the
    map remains the backdrop for everything. The "Fleet status" panel pairs a vehicle list with
    color status dots and a day-by-day chart. Each vehicle opens a tabbed card (summary, history,
    events, fuel, maintenance) with a status bar for plan, ignition, fuel and costs. I added modules
    for drivers, chat-style messaging and fuel monitoring, with refills and drops marked on the
    chart.
  outcome: >-
    Case study published on Behance with the identity, the dashboard and 6 detail modules, plus a
    prototype of the flow.
