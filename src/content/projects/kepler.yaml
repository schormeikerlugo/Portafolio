es:
  title: KEPLER
  tagline: PLATAFORMA DE EXPLORACIÓN CON IA
  summary: >-
    KEPLER es una plataforma de exploración de campo que combina visión artificial, GPS, telemetría
    del explorador y un copiloto LLM local llamado Cortex. Tiene una app de iPhone que funciona sin
    conexión y un Centro de Control de escritorio que sigue la misión en vivo. La diseñé y la estoy
    reescribiendo en Rust como monorepo; sigue en desarrollo activo.
  challenge:
    - >-
      En terreno no siempre hay señal: misiones, rastro GPS, capturas y datos de salud tenían que
      guardarse en el teléfono y sincronizarse solos al volver, sin conflictos.
    - >-
      El escritorio, el iPhone y el servidor comparten modelos, reglas y estilo de mapa. Mantener
      tres bases de código separadas multiplicaba los errores.
    - >-
      Los datos son personales y la IA debía ayudar sin enviarlos a la nube. Los reportes
      compartidos entre exploradores no podían exponer lo privado.
  approach: >-
    Reescribí la v0.7 (Electron, React Native y FastAPI) como un workspace de Cargo con crates
    compartidos: dominio, cliente HTTP, protocolo protobuf, estilo de mapa, visión e IA. El Centro
    de Control usa Slint con MapLibre Native, y la app de iPhone es SwiftUI sobre el mismo núcleo
    Rust vía UniFFI, con YOLO en CoreML y almacenamiento offline en SQLite. El servidor en axum
    aplica las políticas RLS de Supabase autoalojado (Postgres, PostGIS y pgvector) en cada
    petición. Cortex corre sobre Ollama local. Un único archivo de tokens define colores,
    tipografía Jura y espaciado para ambas apps.
  outcome: >-
    Versión 0.8 en desarrollo, con 24 pantallas de referencia del Centro de Control: dashboard,
    misión en vivo, mapa, archivos, bitácora y Cortex.
en:
  title: KEPLER
  tagline: AI FIELD EXPLORATION PLATFORM
  summary: >-
    KEPLER is a field exploration platform that combines computer vision, GPS, explorer telemetry
    and a local LLM copilot called Cortex. It has an iPhone app that works offline and a desktop
    Control Center that follows missions live. I designed it and am rewriting it in Rust as a
    monorepo; it is still in active development.
  challenge:
    - >-
      There is often no signal in the field: missions, GPS tracks, captures and health data had to
      be stored on the phone and sync automatically on return, without conflicts.
    - >-
      Desktop, iPhone and server share models, rules and map style. Keeping three separate codebases
      multiplied bugs.
    - >-
      The data is personal, and the AI had to help without sending it to the cloud. Reports shared
      between explorers could not expose anything private.
  approach: >-
    I rewrote v0.7 (Electron, React Native and FastAPI) as a Cargo workspace with shared crates for
    the domain, HTTP client, protobuf protocol, map style, vision and AI. The Control Center uses
    Slint with MapLibre Native, and the iPhone app is SwiftUI on top of the same Rust core via
    UniFFI, with YOLO on CoreML and offline storage in SQLite. The axum server enforces the RLS
    policies of a self-hosted Supabase stack (Postgres, PostGIS and pgvector) on every request.
    Cortex runs on local Ollama. A single token file defines colors, Jura typography and spacing
    for both apps.
  outcome: >-
    Version 0.8 in progress, with 24 Control Center reference screens: dashboard, live mission, map,
    archives, logbook and Cortex.
