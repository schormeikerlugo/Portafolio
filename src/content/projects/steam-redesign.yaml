es:
  title: STEAM REDESIGN
  tagline: REDISEÑO NO OFICIAL DE STEAM
  summary: >-
    Ejercicio personal de rediseño del cliente de escritorio de Steam. Propuse una nueva interfaz
    para las funciones principales del programa: acceso, tienda, biblioteca, pagos, amigos, grupos,
    inventario, intercambios, capturas, guías y Workshop, presentadas como un prototipo de software.
  challenge:
    - >-
      Steam reúne en un mismo programa tienda, biblioteca, red social y mercado de objetos. La
      navegación tenía que dar acceso a todo sin abrumar.
    - >-
      Las funciones secundarias (intercambios, guías, Workshop) suelen quedar escondidas. Quería
      darles un lugar claro dentro de la estructura.
    - >-
      La biblioteca y la tienda debían mostrar muchos juegos sin perder orden visual.
  approach: >-
    Estructuré la aplicación con un menú principal fijo a la izquierda, un menú secundario por
    sección y un menú de personalización para el perfil. La biblioteca ofrece tres vistas
    intercambiables para que cada usuario elija cómo recorrer su colección. Todas las pantallas comparten una base oscura y translúcida sobre arte de los juegos,
    con acentos de color solo en las acciones. El proceso de compra incluye un paso de facturación
    con varios métodos de pago visibles de entrada.
  outcome: >-
    Prototipo de interfaz con más de diez pantallas, desde el acceso hasta Workshop, publicado en
    Behance.
en:
  title: STEAM REDESIGN
  tagline: UNOFFICIAL STEAM REDESIGN
  summary: >-
    A personal redesign exercise for the Steam desktop client. I proposed a new interface for the
    app's core features: sign-in, store, library, payments, friends, groups, inventory, trading,
    screenshots, guides, and Workshop, presented as a software prototype.
  challenge:
    - >-
      Steam combines a store, a library, a social network, and an item market in one app.
      Navigation had to reach all of it without overwhelming the user.
    - >-
      Secondary features (trading, guides, Workshop) tend to get buried. I wanted to give them a
      clear place in the structure.
    - >-
      The library and the store had to display many games without losing visual order.
  approach: >-
    I structured the app around a fixed main menu on the left, a secondary menu per section, and a
    customization menu for the profile. The library offers three switchable views so each user can browse their collection their own way. Every screen shares a dark,
    translucent base over game artwork, with color accents reserved for actions. Checkout includes a
    billing step with several payment methods visible upfront.
  outcome: >-
    Interface prototype with more than ten screens, from sign-in to Workshop, published on Behance.
