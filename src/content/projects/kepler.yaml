es:
  title: KEPLER
  tagline: AI EXPLORATION PLATFORM
  summary: >-
    KEPLER es una plataforma operativa real asistida por Inteligencia Artificial, diseñada para la
    exploración de campo. Inspirada en sistemas de telemetría y HUDs espaciales, funciona como
    herramienta para la búsqueda de recursos y análisis geológico. El ecosistema comprende un Centro
    de Control (Desktop) ultra-ligero conectado a un backend de Python para visión artificial
    (YOLOv11), una Unidad de Campo Móvil nativa (React Native) para exploración en terreno real,
    widgets de mapas satelitales tácticos 3D, chat conversacional con LLMs locales (Llama 3/Mistral)
    para asistencia científica, y un sistema de bases de datos distribuidas (Supabase) que opera
    incluso sin conexión a internet.
  challenge:
    - >-
      La exploración de entornos desconocidos enfrenta una brecha entre percepción humana e
      inteligencia analítica. Datos crudos sin contexto: el ojo humano observa pero no puede
      identificar ni clasificar en tiempo real.
    - >-
      Conectividad intermitente o nula en zonas remotas. Enviar datos a la nube significa esperar
      horas o no tener respuesta. Herramientas fragmentadas: GPS en una app, cámara en otra, notas
      en papel.
    - >-
      Sin registro estructurado e inmediato, los hallazgos se pierden y nunca se correlacionan con
      observaciones anteriores. Tecnología del siglo XXI con flujos de trabajo del siglo XX.
  approach: >-
    KEPLER resuelve la brecha entre percepción humana e inteligencia de campo mediante una
    plataforma que ejecuta modelos YOLOv11 directamente en el dispositivo del explorador, capaz de
    identificar y clasificar minerales en milisegundos sin depender de conexión a internet. Su
    módulo Cortex AI, impulsado por Mistral 7B en ejecución local, va más allá de la detección:
    analiza cada hallazgo en contexto con el historial completo de exploración, permitiendo al
    usuario consultar relaciones entre muestras de distintas misiones mediante lenguaje natural.
    Cada descubrimiento se geolocaliza automáticamente sobre mapas tácticos 3D que combinan
    coordenadas GPS, imágenes satelitales y descripciones de terreno generadas por IA, revelando
    patrones de distribución que el ojo humano no puede detectar por sí solo. Todo el ecosistema
    opera en dos modalidades complementarias — el Centro de Control Desktop para planificación de
    misiones y la Unidad de Campo Móvil con realidad aumentada para ejecución en terreno — con
    sincronización en tiempo real cuando existe conectividad y funcionamiento offline completo
    cuando no la hay, garantizando que ningún hallazgo se pierda independientemente de las
    condiciones del entorno.
en:
  title: KEPLER
  tagline: AI EXPLORATION PLATFORM
  summary: >-
    KEPLER is a real operational platform powered by Artificial Intelligence, designed for field
    exploration. Inspired by telemetry systems and space HUDs, it serves as a tool for resource
    discovery and geological analysis. The ecosystem comprises an ultra-lightweight Control Center
    (Desktop) connected to a Python backend for computer vision (YOLOv11), a native Mobile Field
    Unit (React Native) for real-terrain exploration, tactical 3D satellite map widgets,
    conversational chat with local LLMs (Llama 3/Mistral) for scientific assistance, and a
    distributed database system (Supabase) that operates even without internet connectivity.
  challenge:
    - >-
      Exploration of unknown environments faces a gap between human perception and available
      analytical intelligence in the field. Raw data without context: the human eye observes but
      cannot identify or classify in real time.
    - >-
      Intermittent or no connectivity in remote areas. Sending data to the cloud means waiting hours
      or getting no response. Fragmented tools: GPS in one app, camera in another, notes on paper.
    - >-
      Without structured and immediate recording, findings are lost and never correlated with
      previous observations. 21st century technology with 20th century workflows.
  approach: >-
    KEPLER bridges the gap between human perception and field intelligence through a platform that
    runs YOLOv11 models directly on the explorer's device, capable of identifying and classifying
    minerals in milliseconds without relying on internet connectivity. Its Cortex AI module, powered
    by Mistral 7B running locally, goes beyond detection: it analyzes each finding in context with
    the complete exploration history, enabling the user to query relationships between samples from
    different missions through natural language. Every discovery is automatically geolocalized on
    tactical 3D maps that combine GPS coordinates, satellite imagery, and AI-generated terrain
    descriptions, revealing distribution patterns that the human eye cannot detect on its own. The
    entire ecosystem operates in two complementary modes — the Desktop Control Center for mission
    planning and the Mobile Field Unit with augmented reality for terrain execution — with real-time
    synchronization when connectivity exists and full offline operation when it does not, ensuring
    no finding is ever lost regardless of environmental conditions.
