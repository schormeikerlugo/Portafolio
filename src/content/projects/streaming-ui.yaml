es:
  title: STREAMING UI
  tagline: LANDING DE STREAMING EN VIVO
  summary: >-
    Concepto de landing page para una plataforma de streaming en vivo enfocada en conciertos y
    eventos. Diseñé el hero como shot para Dribbble, centrado en transmitir la energía de un evento
    en directo.
  challenge:
    - >-
      Comunicar "en vivo" desde el primer vistazo, sin depender de que el visitante lea el texto.
    - >-
      Equilibrar un titular grande con un vídeo destacado sin que ambos compitan por la atención.
    - >-
      Mantener la interfaz sobria para que la imagen del evento sea la protagonista.
  approach: >-
    Construí el fondo con una versión desenfocada de la propia escena del concierto en violetas y
    azules, lo que unifica la pantalla con el vídeo. El titular va en mayúsculas con mucho
    espaciado entre letras, alineado a la izquierda, seguido de un párrafo corto y un botón de
    demo. A la derecha, el reproductor muestra un frame del público con botón de play y una
    etiqueta azul "Live now" que sobresale del marco. El header reduce la navegación a Features,
    Pricing y About.
  outcome: >-
    Shot publicado en Dribbble con el hero de la landing.
en:
  title: STREAMING UI
  tagline: LIVE STREAMING LANDING PAGE
  summary: >-
    A landing page concept for a live streaming platform focused on concerts and events. I designed
    the hero as a Dribbble shot, aiming to convey the energy of a live event.
  challenge:
    - >-
      Communicating "live" at first glance, without relying on visitors reading the copy.
    - >-
      Balancing a large headline with a featured video so they don't compete for attention.
    - >-
      Keeping the interface restrained so the event footage stays front and center.
  approach: >-
    I built the background from a blurred version of the concert scene itself in purples and blues,
    tying the screen to the video. The headline is set in widely tracked uppercase, left-aligned,
    followed by a short paragraph and a demo button. On the right, the player shows a crowd frame
    with a play button and a blue "Live now" tag breaking out of the frame. The header trims
    navigation to Features, Pricing and About.
  outcome: >-
    Shot published on Dribbble showing the landing page hero.
