es:
  title: DASHBOARD POS
  tagline: PANEL DE INICIO PARA PUNTO DE VENTA
  summary: >-
    Pantalla de inicio de un dashboard para negocios que venden en tienda física y canales online.
    La diseñé como shot para Dribbble, enfocada en que el dueño del negocio vea qué necesita
    atención apenas entra.
  challenge:
    - >-
      Al abrir el panel, el usuario debe saber en segundos qué tareas tiene pendientes, sin leer
      tablas.
    - >-
      Las ventas de varios canales y sucursales tenían que resumirse en una sola vista filtrable.
    - >-
      Un tema oscuro con muchos datos corre el riesgo de perder contraste y jerarquía.
  approach: >-
    Abrí la pantalla con un saludo personal y filtros de sucursal y rango de fechas, para que todo
    lo de abajo responda a ese contexto. El primer bloque es un aviso con tres acciones
    pendientes (pedidos por preparar, pagos por capturar, productos por agotarse), cada una con su
    icono y acceso directo. La columna derecha resume el total de ventas en MXN, el número de
    pedidos y una gráfica de barras apiladas por día. Usé el azul solo para datos clave y enlaces,
    sobre superficies grises escalonadas que separan cada bloque.
  outcome: >-
    Shot publicado en Dribbble con la pantalla de inicio del dashboard.
en:
  title: DASHBOARD POS
  tagline: POINT OF SALE HOME DASHBOARD
  summary: >-
    The home screen of a dashboard for businesses selling in physical stores and online channels. I
    designed it as a Dribbble shot, focused on letting the business owner see what needs attention
    as soon as they log in.
  challenge:
    - >-
      On opening the panel, users should know within seconds what tasks are pending, without
      reading tables.
    - >-
      Sales from several channels and branches had to be summarized in a single filterable view.
    - >-
      A dark theme with lots of data risks losing contrast and hierarchy.
  approach: >-
    I opened the screen with a personal greeting and branch and date-range filters, so everything
    below responds to that context. The first block is an alert with three pending actions (orders
    to prepare, payments to capture, products running low), each with its own icon and shortcut.
    The right column summarizes total sales in MXN, the order count and a stacked daily bar chart. I
    kept blue for key figures and links only, over stepped gray surfaces that separate each block.
  outcome: >-
    Shot published on Dribbble showing the dashboard home screen.
