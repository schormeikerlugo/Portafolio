es:
  title: AITHR
  tagline: MARCA Y WEB PARA SOFTWARE AUTOMOTRIZ
  summary: >-
    AITHR es una propuesta de identidad y sitio web para una plataforma de software automotriz que
    ayuda a concesionarios a gestionar inventario y financiamiento subprime. Diseñé la guía de
    estilo, el logotipo y la landing completa.
  challenge:
    - >-
      Explicar un producto financiero B2B bastante técnico a dueños de concesionarios sin llenar la
      página de jerga.
    - >-
      Hacer que una marca de software se sintiera cercana al mundo del motor, no a una fintech
      genérica.
    - >-
      Mantener coherencia entre el logo, las fotos de vehículos y las capturas del propio software.
  approach: >-
    Definí una paleta casi monocroma (#000000, #0D0D0D, #D9D9D9, #FFFFFF) para que el color lo
    pongan las fotografías de coches, y probé Poppins, Lato y Roboto antes de fijar la jerarquía
    tipográfica. El logotipo en minúsculas itálicas se acompaña de un isotipo en forma de flecha
    hacia abajo y de chevrones que se repiten como recurso gráfico. En la web, las imágenes se
    recortan en franjas diagonales redondeadas que dan movimiento a cada bloque. La landing recorre
    propuesta de valor, casos de estudio, vista del software, AITHR Hub, formulario de contacto y
    FAQ.
  outcome: >-
    Presentación publicada en Behance con guía de estilo, variantes del logo, mockups y la landing
    page completa.
en:
  title: AITHR
  tagline: AUTOMOTIVE SOFTWARE BRAND + WEB
  summary: >-
    AITHR is an identity and website proposal for an automotive software platform that helps
    dealerships manage inventory and subprime financing. I designed the style guide, the logo and the
    full landing page.
  challenge:
    - >-
      Explaining a fairly technical B2B financial product to dealership owners without flooding the
      page with jargon.
    - >-
      Making a software brand feel close to car culture rather than a generic fintech.
    - >-
      Keeping the logo, vehicle photography and product screenshots visually consistent.
  approach: >-
    I set an almost monochrome palette (#000000, #0D0D0D, #D9D9D9, #FFFFFF) so the car photography
    brings the color, and tested Poppins, Lato and Roboto before locking the type hierarchy. The
    lowercase italic wordmark pairs with a downward-arrow symbol and chevrons that repeat as a
    graphic device. On the site, images are cropped into rounded diagonal strips that give each
    block a sense of motion. The landing page flows through the value proposition, case studies, a
    software preview, AITHR Hub, a contact form and an FAQ.
  outcome: >-
    Case study published on Behance with the style guide, logo variations, mockups and the full
    landing page.
