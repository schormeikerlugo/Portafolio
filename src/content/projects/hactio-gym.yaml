es:
  title: HACTIO GYM
  tagline: PLATAFORMA WEB DE FITNESS
  summary: >-
    Hactio es un concepto de plataforma web que conecta entrenadores personales, clientes y
    gimnasios. Diseñé la marca y la home como un carrusel de cinco pantallas, una por cada propuesta
    del servicio.
  challenge:
    - >-
      La plataforma habla a dos públicos a la vez, entrenadores que buscan clientes y personas que
      buscan entrenador, y ninguno debía sentirse secundario.
    - >-
      Había varias propuestas (contratar entrenador, clases online, encontrar gimnasio) que
      explicar sin convertir la home en un muro de texto.
    - >-
      La marca necesitaba un símbolo reconocible que funcionara tanto en logo grande como en el
      header.
  approach: >-
    La primera pantalla divide el hero en dos llamadas, "Ser entrenador" y "Ser cliente", cada una
    con su botón de registro. El resto de la home es un slider vertical de cinco pantallas con
    paginación numerada; cada una presenta un beneficio con un titular corto, un campo de email y un
    CTA. Construí el logo como una H formada por dos mancuernas y la apliqué en rojo degradado sobre
    fondos oscuros. Las formas orgánicas rojas recortan las fotografías y dan ritmo entre
    pantallas, y un set de iconos de línea acompaña cada perfil.
  outcome: >-
    Presentación publicada en Behance con el logo y 5 pantallas de la home.
en:
  title: HACTIO GYM
  tagline: FITNESS WEB PLATFORM
  summary: >-
    Hactio is a web platform concept that connects personal trainers, clients and gyms. I designed
    the brand and the home page as a five-screen carousel, one per service proposition.
  challenge:
    - >-
      The platform speaks to two audiences at once, trainers looking for clients and people looking
      for a trainer, and neither should feel secondary.
    - >-
      Several propositions (hiring a trainer, online classes, finding a gym) had to be explained
      without turning the home page into a wall of text.
    - >-
      The brand needed a recognizable symbol that worked both as a large logo and in the header.
  approach: >-
    The first screen splits the hero into two calls, "Be a trainer" and "Be a client", each with its
    own sign-up button. The rest of the home page is a five-screen vertical slider with numbered
    pagination; each screen presents one benefit with a short headline, an email field and a CTA. I
    built the logo as an H made of two dumbbells and applied it in a red gradient over dark
    backgrounds. Organic red shapes crop the photography and set the rhythm between screens, and a
    line icon set supports each profile.
  outcome: >-
    Case study published on Behance with the logo and 5 home page screens.
