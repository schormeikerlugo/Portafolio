es:
  title: FLORRIA WEB IA
  tagline: WEB DE JUEGO CON ARTE IA
  summary: >-
    Florria es un juego de fantasía inventado para este ejercicio: cuatro reinos y cuatro jóvenes
    con dones que deben salvarlo. Diseñé su web de presentación usando imágenes generadas con IA
    (Bing Image Creator) para escenarios y personajes, y las integré en la interfaz con Photoshop.
  challenge:
    - >-
      Las imágenes generadas con IA no salen con un estilo uniforme. Había que hacer que castillo,
      reinos y personajes parecieran del mismo juego.
    - >-
      Sin gameplay ni tráiler, la página tenía que vender el mundo solo con ilustración, texto y
      estructura.
    - >-
      Cuatro reinos y cuatro personajes debían presentarse de forma ordenada y fácil de comparar.
  approach: >-
    Armé la página alternando secciones oscuras de ilustración con bloques de pergamino claro, unidos
    por ornamentos metálicos y una tipografía serif de aire medieval. Los reinos se presentan en
    cuatro columnas con su emblema, y los personajes como cartas coleccionables con marco común,
    nivel y atributos, acompañadas de su historia en zigzag. Retoqué las imágenes de IA para
    acercarlas a una misma paleta de naranjas, azules y verdes. El llamado a registrarse se repite
    en mitad de la página y al final, sobre el castillo.
  outcome: >-
    Landing completa y set de cuatro cartas de personaje publicados en Behance.
en:
  title: FLORRIA WEB IA
  tagline: GAME WEBSITE WITH AI ART
  summary: >-
    Florria is a fantasy game invented for this exercise: four kingdoms and four gifted young heroes
    who must save them. I designed its showcase website using AI-generated images (Bing Image
    Creator) for scenery and characters, and blended them into the interface in Photoshop.
  challenge:
    - >-
      AI-generated images don't come out in a consistent style. The castle, kingdoms, and characters
      had to look like they belonged to the same game.
    - >-
      With no gameplay or trailer, the page had to sell the world through illustration, copy, and
      structure alone.
    - >-
      Four kingdoms and four characters had to be presented in an orderly, easy-to-compare way.
  approach: >-
    I built the page by alternating dark illustrated sections with light parchment blocks, linked by
    metal ornaments and a medieval-flavored serif typeface. Kingdoms are shown in four columns with
    their emblem, and characters as collectible cards with a shared frame, level, and stats, paired
    with their backstory in a zigzag layout. I retouched the AI images to pull them toward one
    palette of oranges, blues, and greens. The sign-up call to action appears mid-page and again at
    the end, over the castle.
  outcome: >-
    Full landing page and a set of four character cards published on Behance.
