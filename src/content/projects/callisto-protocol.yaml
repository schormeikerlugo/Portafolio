es:
  title: THE CALLISTO PROTOCOL
  tagline: WEB CONCEPTUAL DE VIDEOJUEGO
  summary: >-
    Concepto no oficial de sitio web promocional para The Callisto Protocol, un survival horror
    ambientado en una prisión de la luna Callisto. Diseñé tres páginas (inicio, historia y galería
    de medios) en escritorio y móvil, con su guía de estilo y un prototipo navegable.
  challenge:
    - >-
      La web tenía que transmitir el tono opresivo del juego sin que el contenido promocional
      (reserva, plataformas, registro) quedara escondido en la oscuridad.
    - >-
      Las páginas de historia tienen bloques largos de texto que debían leerse bien sobre imágenes
      muy oscuras.
    - >-
      La composición de escritorio, con mucho aire y elementos laterales, tenía que adaptarse a una
      sola columna en móvil.
  approach: >-
    Definí un sistema corto: Infield Rough para titulares, Silka Mono para texto y una paleta de
    blanco, cian (#79ECEE) y ámbar (#F1C858) sobre negro, todo en una retícula de 1920×1080. Los
    detalles tipo interfaz de nave (marcas de medición, coordenadas y esquinas de mira) enmarcan el
    contenido y lo conectan con el mundo del juego. Los bordes rasgados en azul separan secciones y
    dan textura sin tapar el texto. La galería usa una rejilla de seis miniaturas con barra de
    progreso, que en móvil pasa a un carrusel de una imagen.
  outcome: >-
    Tres páginas en escritorio y móvil, guía de estilo y prototipo publicados en Behance.
en:
  title: THE CALLISTO PROTOCOL
  tagline: GAME WEBSITE CONCEPT
  summary: >-
    An unofficial promotional website concept for The Callisto Protocol, a survival horror game set
    in a prison on the moon Callisto. I designed three pages (home, story, and media gallery) for
    desktop and mobile, along with a style guide and a clickable prototype.
  challenge:
    - >-
      The site had to convey the game's oppressive tone without burying the promotional content
      (pre-order, platforms, sign-up) in darkness.
    - >-
      The story pages carry long blocks of text that had to stay readable over very dark imagery.
    - >-
      The airy desktop layout, with elements along the edges, had to collapse into a single mobile
      column.
  approach: >-
    I set up a compact system: Infield Rough for headlines, Silka Mono for body text, and a palette
    of white, cyan (#79ECEE), and amber (#F1C858) on black, all on a 1920×1080 grid. Spaceship-style
    UI details (measurement ticks, coordinates, and targeting corners) frame the content and tie it
    to the game world. Torn blue edges separate sections and add texture without covering the text.
    The gallery uses a six-thumbnail grid with a progress bar, which becomes a single-image carousel
    on mobile.
  outcome: >-
    Three pages for desktop and mobile, a style guide, and a prototype published on Behance.
