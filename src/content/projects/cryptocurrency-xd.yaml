es:
  title: CRYPTOCURRENCY XD
  tagline: LANDING CRYPTO GRATIS PARA XD
  summary: >-
    Plantilla gratuita en Adobe XD de una landing para Bullex, un exchange de criptomonedas
    ficticio. La publiqué en Behance como archivo descargable para que otros diseñadores la usaran
    de base. Incluye dos variantes de la misma página.
  challenge:
    - >-
      Un exchange tiene que inspirar confianza y, al mismo tiempo, mostrar muchos datos: precios,
      variaciones, noticias y saldos.
    - >-
      Al ser un recurso para descargar, el archivo debía ser fácil de entender y de modificar por
      otra persona.
    - >-
      Las tablas de monedas y saldos tenían que leerse bien incluso con muchas filas.
  approach: >-
    La página alterna fondos azul marino y blanco separados por curvas, con secciones claras: hero,
    por qué operar con Bullex, selección de monedas, noticias, activos y un bloque social. Las
    monedas aparecen como tarjetas compactas con precio de compra y venta y variación en verde o
    rojo. La sección de activos usa una tabla con buscador y columnas de saldo total, disponible y en
    orden. Las dos variantes muestran la selección de monedas como carrusel y como rejilla, para que
    quien descargue el archivo elija la que le sirva.
  outcome: >-
    Archivo de Adobe XD con dos variantes de landing, publicado como descarga gratuita en Behance.
en:
  title: CRYPTOCURRENCY XD
  tagline: FREE CRYPTO LANDING FOR XD
  summary: >-
    A free Adobe XD template for a landing page of Bullex, a fictional cryptocurrency exchange. I
    published it on Behance as a downloadable file so other designers could use it as a starting
    point. It includes two variants of the same page.
  challenge:
    - >-
      An exchange has to feel trustworthy while showing a lot of data: prices, changes, news, and
      balances.
    - >-
      As a downloadable resource, the file had to be easy for someone else to understand and edit.
    - >-
      Coin and balance tables had to stay readable even with many rows.
  approach: >-
    The page alternates navy and white backgrounds split by curves, with clear sections: hero, why
    trade with Bullex, currency selection, news, assets, and a social block. Coins appear as compact
    cards with buy and sell prices and a green or red change indicator. The assets section uses a
    searchable table with total, available, and in-order balance columns. The two variants show the
    currency selection as a carousel and as a grid, so whoever downloads the file can pick the one
    that fits.
  outcome: >-
    Adobe XD file with two landing page variants, published as a free download on Behance.
