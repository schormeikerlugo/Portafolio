es:
  title: SNAKE CLASSIC
  tagline: SNAKE RETRO CON MULTIJUGADOR
  summary: >-
    Versión propia del Snake clásico con estética retro, jugable en el navegador e instalable como
    PWA. Añadí power-ups, obstáculos, ranking global y multijugador online en tiempo real. Diseñé la
    interfaz y programé el juego completo, del canvas a la base de datos en Supabase.
  challenge:
    - >-
      El Snake original se agota rápido. Necesitaba mecánicas nuevas que dieran variedad sin perder
      la simplicidad de controlar una serpiente que crece.
    - >-
      En multijugador, dos jugadores en dispositivos distintos tenían que ver los mismos movimientos,
      la misma comida y el mismo marcador al mismo tiempo.
    - >-
      El juego debía sentirse bien en móvil: controles táctiles precisos, pantalla completa y
      respuesta háptica, igual de cómodo que con teclado.
  approach: >-
    Separé el código en módulos de JavaScript por responsabilidad: núcleo del juego, render, UI,
    sonido y funciones como auth, chat, ranking y multijugador. El juego se dibuja en HTML5 Canvas
    con movimiento interpolado por requestAnimationFrame, y la serpiente cambia de color cada 10
    puntos. Hay 6 power-ups, cada uno con forma y color propios para reconocerlos de un vistazo. El
    multijugador usa canales de Supabase Realtime por sala, con dos modos: duelo 1v1 y competencia
    por puntos de 2 minutos con modo fantasma. El esquema y las políticas RLS viven en migraciones
    SQL.
  outcome: >-
    Juego publicado en GitHub Pages, instalable como PWA, con interfaz en español e inglés, salas
    privadas con código, chat, revancha y ranking global.
en:
  title: SNAKE CLASSIC
  tagline: RETRO SNAKE WITH MULTIPLAYER
  summary: >-
    My own take on classic Snake with a retro look, playable in the browser and installable as a
    PWA. I added power-ups, obstacles, a global leaderboard and real-time online multiplayer. I
    designed the interface and built the whole game, from the canvas to the Supabase database.
  challenge:
    - >-
      Original Snake wears thin quickly. It needed new mechanics that added variety without losing
      the simplicity of steering a growing snake.
    - >-
      In multiplayer, two players on different devices had to see the same moves, the same food and
      the same score at the same time.
    - >-
      The game had to feel right on mobile: precise touch controls, full screen and haptic feedback,
      as comfortable as playing with a keyboard.
  approach: >-
    I split the code into JavaScript modules by responsibility: game core, rendering, UI, sound, and
    features such as auth, chat, leaderboard and multiplayer. The game is drawn on HTML5 Canvas with
    movement interpolated through requestAnimationFrame, and the snake changes color every 10
    points. There are 6 power-ups, each with its own shape and color so they read at a glance.
    Multiplayer runs on per-room Supabase Realtime channels with two modes: a 1v1 duel and a
    2-minute points race with ghost mode. The schema and RLS policies live in SQL migrations.
  outcome: >-
    Game published on GitHub Pages, installable as a PWA, with a Spanish and English interface,
    private rooms with codes, chat, rematches and a global leaderboard.
