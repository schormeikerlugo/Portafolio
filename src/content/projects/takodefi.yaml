es:
  title: TAKODEFI
  tagline: UI DE STAKING Y FARMING DEFI
  summary: >-
    TakoDefi es una plataforma de yield farming sobre BSC y Polygon. Entre agosto de 2020 y abril de
    2021 diseñé su nueva interfaz: inicio, pools de staking, farms de liquidez, vaults con
    autocompound y Bermudas, un modo de farming competitivo por tiempo limitado. Cada sección tiene
    versión de escritorio y móvil, en tema claro y oscuro.
  challenge:
    - >-
      Cada tarjeta de pool o farm concentra muchos datos (APR, APY, ganancias, cantidad en stake,
      TVL) y varias acciones (approve, harvest, compound, stake). Había que ordenarlos para que se
      leyeran rápido.
    - >-
      La plataforma tenía cinco productos con mecánicas distintas. Debían sentirse parte del mismo
      sistema y, a la vez, distinguirse a simple vista.
    - >-
      Todo el producto debía funcionar en móvil y en dos temas de color sin duplicar el trabajo de
      diseño pantalla por pantalla.
  approach: >-
    Diseñé una tarjeta base que repite siempre el mismo orden: token y par arriba, ganancias en el
    centro y la acción principal en un botón de alto contraste, con métricas secundarias y detalles
    plegables debajo. Cada sección recibe una cabecera ilustrada y un color propio (naranja en Pools,
    azul en Vaults, magenta en Bermudas) sobre la misma retícula. La mascota del pulpo y los iconos
    de luna y sol aportan una identidad amable a un producto técnico. El menú lateral de escritorio
    pasa a menú hamburguesa en móvil, y las tarjetas en rejilla se apilan en una sola columna.
  outcome: >-
    Interfaz de cinco secciones (Home, Pools, Farms, Vaults y Bermudas) en escritorio y móvil, con
    temas claro y oscuro, publicada en Behance.
en:
  title: TAKODEFI
  tagline: DEFI STAKING & FARMING UI
  summary: >-
    TakoDefi is a yield farming platform on BSC and Polygon. From August 2020 to April 2021 I
    designed its new interface: home, staking pools, liquidity farms, auto-compounding vaults, and
    Bermudas, a time-limited competitive farming mode. Every section has desktop and mobile versions
    in both light and dark themes.
  challenge:
    - >-
      Each pool or farm card packs a lot of data (APR, APY, earnings, staked amount, TVL) and several
      actions (approve, harvest, compound, stake). It all had to be scannable at a glance.
    - >-
      The platform had five products with different mechanics. They needed to feel like one system
      while still being easy to tell apart.
    - >-
      The whole product had to work on mobile and in two color themes without redesigning every
      screen from scratch.
  approach: >-
    I built a base card that always follows the same order: token or pair at the top, earnings in
    the middle, and the primary action as a high-contrast button, with secondary metrics and
    collapsible details below. Each section gets an illustrated header and its own color (orange for
    Pools, blue for Vaults, magenta for Bermudas) on a shared grid. The octopus mascot and the moon
    and sun icons give a friendly identity to a technical product. The desktop sidebar becomes a
    hamburger menu on mobile, and card grids collapse into a single column.
  outcome: >-
    A five-section interface (Home, Pools, Farms, Vaults, and Bermudas) for desktop and mobile, in
    light and dark themes, published on Behance.
