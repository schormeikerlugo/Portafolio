es:
  title: HOTEL SYSTEM
  tagline: SOFTWARE DE GESTIÓN HOTELERA
  summary: >-
    Path's Hotel System es un concepto de software de escritorio para el personal de un hotel:
    recepción, reservas, tarifas, ama de llaves, banquetes y auditoría. Diseñé la interfaz, el set de
    iconos y la identidad del producto.
  challenge:
    - >-
      Un sistema con muchos módulos (reservas individuales y de grupo, tarifas, limpieza, vehículos,
      reportes) necesitaba un punto de entrada que no abrumara al usuario.
    - >-
      Las pantallas de trabajo son tablas y formularios densos; había que mantenerlas legibles en
      jornadas largas frente al monitor.
    - >-
      Acciones como eliminar un registro o modificar una reserva requerían confirmaciones claras
      para evitar errores.
  approach: >-
    Resolví la navegación con un menú principal de mosaicos, uno por módulo, que combina icono y
    fotografía para reconocerlos de un vistazo. Todo el sistema usa un tema azul oscuro con acentos
    azul claro y formularios agrupados en paneles. Dibujé un set de iconos propio para módulos y
    acciones (check-in, check-out, factura, allotment, filtros…) y lo repetí en las barras de
    herramientas de cada pantalla. Para los avisos diseñé una familia de mensajes emergentes
    (información, eliminación, error) con el mismo patrón de botón aceptar/cancelar.
  outcome: >-
    Presentación publicada en Behance con el login, el menú de módulos, 7 pantallas de trabajo, los
    mensajes emergentes y el set de iconos.
en:
  title: HOTEL SYSTEM
  tagline: HOTEL MANAGEMENT SOFTWARE
  summary: >-
    Path's Hotel System is a desktop software concept for hotel staff: front desk, reservations,
    rates, housekeeping, banquets and auditing. I designed the interface, the icon set and the
    product identity.
  challenge:
    - >-
      A system with many modules (individual and group bookings, rates, housekeeping, vehicles,
      reports) needed an entry point that wouldn't overwhelm users.
    - >-
      Working screens are dense tables and forms; they had to stay readable through long shifts at
      the monitor.
    - >-
      Actions such as deleting a record or changing a booking needed clear confirmations to prevent
      mistakes.
  approach: >-
    I solved navigation with a tile-based main menu, one tile per module, mixing icon and photo so
    each one is recognizable at a glance. The whole system uses a dark blue theme with light blue
    accents and forms grouped into panels. I drew a custom icon set for modules and actions
    (check-in, check-out, invoice, allotment, filters…) and reused it in every screen's toolbar. For
    alerts I designed a family of modal messages (info, delete, error) sharing the same
    accept/cancel button pattern.
  outcome: >-
    Case study published on Behance with the login, module menu, 7 working screens, modal messages
    and icon set.
