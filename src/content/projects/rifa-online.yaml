es:
  title: RIFA ONLINE
  tagline: PLATAFORMA DE RIFAS ONLINE
  summary: >-
    Plataforma web para organizar rifas. Los participantes eligen sus números y suben el comprobante
    de pago; el organizador crea rifas y aprueba o rechaza reservas desde un panel propio. La
    construí con HTML, CSS y JavaScript sin frameworks, y usé Supabase como backend completo.
  challenge:
    - >-
      Dos personas no podían reservar el mismo número, y cada participante tenía que ver qué números
      quedaban libres sin recargar la página.
    - >-
      Las operaciones sensibles, como crear rifas o moderar reservas, no podían depender de código
      del navegador que cualquiera puede modificar.
    - >-
      Sin servidor propio, la autenticación, el almacenamiento de comprobantes, los correos y la
      lógica de negocio tenían que resolverse con servicios gestionados.
  approach: >-
    Dividí el proyecto en dos aplicaciones, cliente y panel de administración, cada una organizada
    por funciones y con su propio CSS modular basado en variables. Las acciones críticas pasan por
    Edge Functions de Supabase escritas en TypeScript sobre Deno: crear, editar y eliminar rifas,
    reservar números y moderar reservas. Los comprobantes se guardan en Supabase Storage y el panel
    recibe avisos de nuevas reservas por Supabase Realtime. Los correos al participante salen por
    una función que llama a la API de Resend.
  outcome: >-
    Sitio publicado en GitHub Pages con vista de cliente, panel de administración y 7 Edge Functions
    en Supabase.
en:
  title: RIFA ONLINE
  tagline: ONLINE RAFFLE PLATFORM
  summary: >-
    A web platform for running raffles. Participants pick their numbers and upload proof of
    payment; the organizer creates raffles and approves or rejects reservations from a dedicated
    panel. I built it with framework-free HTML, CSS and JavaScript, using Supabase as the entire
    backend.
  challenge:
    - >-
      Two people could not reserve the same number, and every participant had to see which numbers
      were still free without reloading the page.
    - >-
      Sensitive operations, like creating raffles or moderating reservations, could not rely on
      browser code that anyone can tamper with.
    - >-
      With no server of my own, authentication, receipt storage, emails and business logic had to
      run on managed services.
  approach: >-
    I split the project into two apps, the client and the admin panel, each organized by feature
    with its own modular, variable-based CSS. Critical actions go through Supabase Edge Functions
    written in TypeScript on Deno: creating, editing and deleting raffles, reserving numbers and
    moderating reservations. Receipts are stored in Supabase Storage, and the panel gets notified of
    new reservations through Supabase Realtime. Emails to participants are sent by a function that
    calls the Resend API.
  outcome: >-
    Site published on GitHub Pages with a client view, an admin panel and 7 Supabase Edge
    Functions.
