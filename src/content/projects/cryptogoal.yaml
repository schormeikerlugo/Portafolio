es:
  title: CRYPTOGOAL.IO
  tagline: CRYPTO SPORTS WEB
  summary: >-
    CryptoGoal.io es una plataforma que fusiona predicciones deportivas con criptomonedas,
    permitiendo a los usuarios apostar tokens sobre resultados de partidos reales. El proyecto
    abarcó la landing page y el dashboard principal, dirigidos a un público dual: fans deportivos
    sin experiencia crypto y traders que buscan mercados alternativos. Su principal desafío radicaba
    en traducir conceptos blockchain complejos a un lenguaje visual que resultara familiar para
    cualquier aficionado al deporte.
  challenge:
    - >-
      El 78% del público objetivo (fans deportivos) nunca había interactuado con una wallet crypto.
      Los términos "gas fee", "slippage" y "smart contract" generaban abandono inmediato en las
      pruebas de usuario.
    - >-
      Los conceptos blockchain debían simplificarse sin ocultar información financiera relevante.
      Los reguladores exigen transparencia en cada operación.
    - >-
      No existía competencia directa en el mercado, por lo que los UX patterns debían definirse
      desde cero sin referencias de comportamiento de usuario previas.
  approach: >-
    La interfaz prioriza la narrativa deportiva sobre la terminología crypto: los usuarios ven
    partidos, equipos y cuotas, mientras la capa blockchain opera de forma transparente en segundo
    plano. Las cards de predicción ofrecen feedback visual inmediato con animaciones de resultado
    que replican la emoción de un gol. El dashboard presenta estadísticas en tiempo real y gráficos
    de rendimiento del portfolio de apuestas, además de un onboarding gamificado que enseña los
    conceptos crypto mediante retos progresivos.
en:
  title: CRYPTOGOAL.IO
  tagline: CRYPTO SPORTS WEB
  summary: >-
    CryptoGoal.io is a platform that merges sports predictions with cryptocurrency, allowing users
    to wager tokens on real match outcomes. The project covered the landing page and main dashboard,
    targeting a dual audience: sports fans with no crypto experience and traders seeking alternative
    markets. Its main challenge was translating complex blockchain concepts into a visual language
    that felt familiar to any sports enthusiast.
  challenge:
    - >-
      78% of the target audience (sports fans) had never interacted with a crypto wallet. Terms like
      "gas fee," "slippage," and "smart contract" caused immediate abandonment in user tests.
    - >-
      Blockchain concepts had to be simplified without hiding relevant financial information.
      Regulators require transparency in every transaction.
    - >-
      No direct competition existed in the market, so UX patterns had to be defined from scratch
      with no prior user behavior references.
  approach: >-
    The interface prioritizes the sports narrative over crypto terminology: users see matches,
    teams, and odds while the blockchain layer operates transparently in the background. Prediction
    cards deliver immediate visual feedback with result animations that replicate the thrill of a
    goal. The dashboard presents real-time statistics and betting portfolio performance charts,
    along with a gamified onboarding that teaches crypto concepts through progressive challenges.
