es:
  title: METEGRITY
  tagline: REDISEÑO WEB CORPORATIVO INDUSTRIAL
  summary: >-
    Rediseño del sitio corporativo de Metegrity, empresa de software para la gestión de integridad
    de activos industriales (AIM). No es el sitio oficial: es una versión propia que construí con
    Astro, desde la portada hasta productos, industrias, recursos y reserva de demo.
  challenge:
    - >-
      Productos técnicos como Visions Enterprise, Visions RBI y VisionsGo tenían que explicarse con
      claridad a ingenieros y directivos, sin esconderse detrás de la jerga.
    - >-
      El sitio tiene mucho contenido: productos, servicios, industrias, blogs, ebooks, casos de éxito
      y páginas legales. Necesitaba una estructura que escalara sin repetir código.
    - >-
      Las ilustraciones industriales debían transmitir precisión técnica sin cargar imágenes pesadas
      ni librerías de animación.
  approach: >-
    Usé Astro como generador estático y escribí todo el CSS a mano, sin Tailwind, con variables
    globales para espaciado y color y estilos scoped en cada componente. Los layouts se apoyan en
    Grid y Flexbox. Las interacciones, como contadores y apariciones al hacer scroll, usan
    IntersectionObserver con JavaScript puro, sin React ni Vue en el cliente. Los diagramas y
    escáneres se dibujan en SVG en línea y se animan con keyframes de CSS. Un componente de barra de
    filtros compartido ordena los listados de recursos.
  outcome: >-
    Sitio publicado en Vercel con 55 páginas, incluidos productos, industrias, blogs, ebooks, casos
    de éxito y un flujo de reserva de demo.
en:
  title: METEGRITY
  tagline: INDUSTRIAL CORPORATE WEB REDESIGN
  summary: >-
    A redesign of the corporate website for Metegrity, an industrial asset integrity management
    (AIM) software company. It is not the official site: it is my own version, built with Astro,
    from the homepage to products, industries, resources and demo booking.
  challenge:
    - >-
      Technical products like Visions Enterprise, Visions RBI and VisionsGo had to be explained
      clearly to engineers and executives without hiding behind jargon.
    - >-
      The site carries a lot of content: products, services, industries, blogs, ebooks, success
      stories and legal pages. It needed a structure that scaled without duplicating code.
    - >-
      The industrial illustrations had to feel technically precise without heavy images or
      animation libraries.
  approach: >-
    I used Astro as a static site generator and wrote all the CSS by hand, without Tailwind, with
    global variables for spacing and color and scoped styles in each component. Layouts rely on Grid
    and Flexbox. Interactions such as counters and scroll reveals use IntersectionObserver with
    plain JavaScript, with no React or Vue on the client. Diagrams and scanners are drawn as inline
    SVG and animated with CSS keyframes. A shared filter bar component organizes the resource
    listings.
  outcome: >-
    Site live on Vercel with 55 pages, including products, industries, blogs, ebooks, success
    stories and a demo booking flow.
