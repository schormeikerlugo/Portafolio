es:
  title: SALTO ÁNGEL
  tagline: WEB TURÍSTICA DE VENEZUELA
  summary: >-
    Concepto de landing turística dedicada al Salto Ángel (Kerepakupai Vená), en el Parque Nacional
    Canaima. Diseñé la pantalla principal como un ejercicio personal para mostrar un destino de mi
    país con una presentación más cuidada.
  challenge:
    - >-
      La fotografía de la cascada es el gran atractivo; el texto y los controles no podían taparla.
    - >-
      La pantalla debía dar el dato esencial del lugar y, a la vez, invitar a explorar otros
      destinos cercanos.
    - >-
      Mantener legible el texto blanco sobre una foto con zonas muy claras (nubes) y muy oscuras
      (selva).
  approach: >-
    Usé la foto de la cascada a pantalla completa con un degradado oscuro en la parte inferior e
    izquierda, donde se concentra el texto. El bloque principal muestra valoración con estrellas,
    nombre, nombre pemón, ubicación, una descripción breve y un botón "Saber más" con borde verde.
    A la derecha, un carrusel de tarjetas con foto y valoración propone otros destinos, controlado
    por flechas y una barra de progreso verde. Una barra lateral vertical con puntos sirve de
    navegación entre secciones.
  outcome: >-
    Shot publicado en Dribbble con la pantalla principal del sitio.
en:
  title: SALTO ÁNGEL
  tagline: VENEZUELA TOURISM WEBSITE
  summary: >-
    A tourism landing page concept for Angel Falls (Kerepakupai Vená) in Canaima National Park. I
    designed the main screen as a personal exercise to showcase a destination from my country with a
    more polished presentation.
  challenge:
    - >-
      The waterfall photo is the main draw; text and controls couldn't cover it.
    - >-
      The screen had to give the essential facts about the place while inviting visitors to explore
      nearby destinations.
    - >-
      Keeping white text readable over a photo with very bright areas (clouds) and very dark ones
      (jungle).
  approach: >-
    I used the waterfall photo full-screen with a dark gradient along the bottom and left, where the
    text lives. The main block shows a star rating, the name, its Pemón name, location, a short
    description and a green-outlined "Learn more" button. On the right, a carousel of photo cards
    with ratings suggests other destinations, driven by arrows and a green progress bar. A vertical
    dotted sidebar acts as section navigation.
  outcome: >-
    Shot published on Dribbble showing the site's main screen.
