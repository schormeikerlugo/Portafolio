es:
  title: SPARTY PROFILE
  tagline: PLANTILLA DE PERFIL DE ATLETA
  summary: >-
    Concepto de plantilla web para perfiles de deportistas, probada con dos atletas de disciplinas
    distintas (fútbol y fútbol americano). Diseñé el hero y la navegación del perfil como ejercicio
    personal publicado en Behance.
  challenge:
    - >-
      La misma plantilla debía funcionar para deportes y fotografías muy diferentes sin
      rediseñarse cada vez.
    - >-
      El nombre del atleta y su disciplina tenían que leerse bien sobre fotos de acción con mucho
      detalle.
    - >-
      El perfil necesitaba dar acceso a varias secciones (estadísticas, equipo, calendario) sin
      cargar el hero.
  approach: >-
    Fijé una estructura común: header con escudo del equipo, buscador y redes, una barra de
    pestañas para las secciones del perfil y un hero con el nombre completo, la disciplina, iconos
    sociales y un botón verde. Cada atleta solo cambia la fotografía de fondo, que oscurezco con
    un degradado para mantener el texto legible. Usé un tema oscuro con el verde como único color
    de acento, un borde luminoso en las tarjetas y tipografía redondeada para el nombre.
  outcome: >-
    Concepto publicado en Behance con dos variantes de perfil.
en:
  title: SPARTY PROFILE
  tagline: ATHLETE PROFILE TEMPLATE
  summary: >-
    A web template concept for athlete profiles, tested with two athletes from different sports
    (soccer and American football). I designed the hero and profile navigation as a personal
    exercise published on Behance.
  challenge:
    - >-
      The same template had to work for very different sports and photography without being
      redesigned each time.
    - >-
      The athlete's name and sport had to read well over detailed action photos.
    - >-
      The profile needed access to several sections (stats, team, schedule) without crowding the
      hero.
  approach: >-
    I set a shared structure: a header with the team crest, search and social links, a tab bar for
    the profile sections, and a hero with the full name, sport, social icons and a green button.
    Each athlete only swaps the background photo, darkened with a gradient to keep the text
    readable. I used a dark theme with green as the single accent color, a soft glowing border on
    the cards and a rounded typeface for the name.
  outcome: >-
    Concept published on Behance with two profile variants.
